<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>Project Bankai</title>
<style>
  html, body { margin: 0; padding: 0; background: #121316; }
  #root { min-height: 100vh; }
</style>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>

<body>
<div id="root">
  <div style="color:#8D909C;font-family:sans-serif;text-align:center;padding:60px 20px;">Loading Project Bankai…</div>
</div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;
const {
  ResponsiveContainer, LineChart, Line, XAxis, YAxis, CartesianGrid,
  Tooltip, Legend, BarChart, Bar, ReferenceLine, ScatterChart, Scatter,
} = Recharts;

/* ------------------------- lightweight icon set (replaces lucide-react) ------------------------- */
function Icon({ children, size = 16, strokeWidth = 2, style, ...rest }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
      strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round"
      style={{ display: "inline-block", verticalAlign: "middle", flexShrink: 0, ...style }} {...rest}>
      {children}
    </svg>
  );
}
const Plus = (p) => <Icon {...p}><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></Icon>;
const X = (p) => <Icon {...p}><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></Icon>;
const ChevronRight = (p) => <Icon {...p}><polyline points="9 18 15 12 9 6" /></Icon>;
const Download = (p) => <Icon {...p}><path d="M12 3v12" /><polyline points="7 11 12 16 17 11" /><path d="M5 19h14" /></Icon>;
const Upload = (p) => <Icon {...p}><path d="M12 19V7" /><polyline points="7 12 12 7 17 12" /><path d="M5 19h14" /></Icon>;
const Timer = (p) => <Icon {...p}><circle cx="12" cy="13" r="8" /><path d="M12 9v4l3 2" /><path d="M9 2h6" /></Icon>;
const TrendingUp = (p) => <Icon {...p}><polyline points="3 17 9 11 13 15 21 6" /><polyline points="15 6 21 6 21 12" /></Icon>;
const Activity = (p) => <Icon {...p}><polyline points="2 12 7 12 10 20 14 4 17 12 22 12" /></Icon>;
const LayoutDashboard = (p) => <Icon {...p}><rect x="3" y="3" width="7" height="9" rx="1" /><rect x="14" y="3" width="7" height="5" rx="1" /><rect x="14" y="12" width="7" height="9" rx="1" /><rect x="3" y="16" width="7" height="5" rx="1" /></Icon>;
const Flag = (p) => <Icon {...p}><path d="M5 21V4" /><path d="M5 4h13l-3 4 3 4H5" /></Icon>;
const AlertCircle = (p) => <Icon {...p}><circle cx="12" cy="12" r="9" /><line x1="12" y1="8" x2="12" y2="13" /><line x1="12" y1="16.5" x2="12" y2="16.6" /></Icon>;
const Trash2 = (p) => <Icon {...p}><path d="M4 7h16" /><path d="M9 7V4h6v3" /><path d="M6 7l1 13h10l1-13" /><line x1="10" y1="11" x2="10" y2="17" /><line x1="14" y1="11" x2="14" y2="17" /></Icon>;
const Dumbbell = (p) => <Icon {...p}><path d="M4 12h16" /><path d="M4 9v6" /><path d="M20 9v6" /><path d="M7 7v10" /><path d="M17 7v10" /></Icon>;
const Pencil = (p) => <Icon {...p}><path d="M12 20h9" /><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z" /></Icon>;


/* ---------------------------------- constants ---------------------------------- */

const LIFTS = ["Deadlift", "Bench Press", "Squat"];
const LIFT_COLOR = { "Deadlift": "var(--red)", "Bench Press": "var(--gold)", "Squat": "var(--violet)" };
const BASELINE_PB = { "Deadlift": 170, "Bench Press": 80, "Squat": 142.5 };
const RACES = [
  { name: "Hyrox Doubles #1", date: "2026-11-21" },
  { name: "Hyrox Doubles #2", date: "2026-12-12" },
];
const GOAL_PACE_SEC = 4 * 60 + 50; // 4:50/km
const RUN_TYPES = ["Easy", "Tempo", "Threshold", "Interval", "Long", "Race"];
const CLASS_OPTIONS = ["Move Total", "Move Upper", "Move Lower"];
const CLASS_TO_LIFT = { "Move Total": "Deadlift", "Move Upper": "Bench Press", "Move Lower": "Squat" };
const VARIATION_OPTIONS = {
  "Deadlift": ["Conventional", "Romanian"],
  "Bench Press": ["Conventional", "Incline"],
  "Squat": ["Back", "Front"],
};

// Paste your deployed Google Apps Script Web App URL here (see paceplate-sheets-backend.gs)
const SHEETS_API_URL = "https://script.google.com/macros/s/AKfycbz4iWqc1QkUOYlMcckSxs2dsm0uamGVk5jtx9W58f0Z25qB07XjjrNU96SZiesuUtXE-Q/exec";

/* ----------------------------------- helpers ------------------------------------ */

const uid = () => Math.random().toString(36).slice(2, 10);
const todayStr = () => new Date().toISOString().slice(0, 10);
const fmtDate = (d) => new Date(d + "T00:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
const fmtShort = (d) => new Date(d + "T00:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short" });
const daysUntil = (d) => Math.ceil((new Date(d + "T00:00:00") - new Date(new Date().toDateString())) / 86400000);

function parsePaceToSec(str) {
  if (!str) return null;
  const parts = String(str).split(":").map(Number);
  if (parts.some(isNaN)) return null;
  return parts.length === 2 ? parts[0] * 60 + parts[1] : null;
}
function secToPace(sec) {
  if (sec == null || isNaN(sec)) return "--:--";
  const m = Math.floor(sec / 60);
  const s = Math.round(sec % 60);
  return `${m}:${String(s).padStart(2, "0")}`;
}
function parseDurationToSec(str) {
  if (!str) return null;
  const parts = String(str).split(":").map(Number);
  if (parts.some(isNaN)) return null;
  if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
  if (parts.length === 2) return parts[0] * 60 + parts[1];
  return null;
}
function fmtDuration(sec) {
  if (sec == null || isNaN(sec)) return "--";
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = Math.round(sec % 60);
  return h > 0 ? `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}` : `${m}:${String(s).padStart(2, "0")}`;
}
const epley1RM = (w, r) => (w && r ? w * (1 + r / 30) : 0);
const maxSetLoad = (entry) => entry.sets.reduce((best, s) => Math.max(best, epley1RM(Number(s.weight), Number(s.reps))), 0);
const maxWeight = (entry) => entry.sets.reduce((best, s) => Math.max(best, Number(s.weight) || 0), 0);
const volume = (entry) => entry.sets.reduce((v, s) => v + (Number(s.weight) || 0) * (Number(s.reps) || 0), 0);
const daysSince = (d) => Math.floor((new Date(new Date().toDateString()) - new Date(d + "T00:00:00")) / 86400000);

/* ------------------------------------ storage (Google Sheets backend) ------------------------------------ */

async function apiFetch(type) {
  try {
    const res = await fetch(`${SHEETS_API_URL}?type=${type}`);
    const data = await res.json();
    return Array.isArray(data) ? data : [];
  } catch (e) {
    console.error("Project Bankai: failed to load", type, e);
    return [];
  }
}

// Uses text/plain content-type deliberately: Apps Script web apps don't handle
// CORS preflight (OPTIONS) requests, and application/json triggers one. Sending
// as text/plain avoids the preflight while the body is still parsed as JSON
// server-side (see doPost in paceplate-sheets-backend.gs).
async function apiSend(payload) {
  try {
    await fetch(SHEETS_API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload),
    });
    return true;
  } catch (e) {
    console.error("Project Bankai: failed to sync", payload, e);
    return false;
  }
}

/* ======================================================================
   APP
   ====================================================================== */

function App() {
  const [tab, setTab] = useState("dashboard");
  const [strength, setStrength] = useState([]);
  const [runs, setRuns] = useState([]);
  const [ready, setReady] = useState(false);
  const [editingStrength, setEditingStrength] = useState(null); // null = closed; {} = new; entry = editing
  const [editingRun, setEditingRun] = useState(null);
  const [dataMsg, setDataMsg] = useState(null);
  const fileInputRef = React.useRef(null);

  useEffect(() => {
    (async () => {
      const [s, r] = await Promise.all([apiFetch("strength"), apiFetch("runs")]);
      setStrength(s.sort((a, b) => a.date.localeCompare(b.date)));
      setRuns(r.sort((a, b) => a.date.localeCompare(b.date)));
      setReady(true);
    })();
  }, []);

  const saveStrength = async (entry) => {
    const isUpdate = strength.some((e) => e.id === entry.id);
    const next = (isUpdate ? strength.map((e) => (e.id === entry.id ? entry : e)) : [...strength, entry])
      .sort((a, b) => a.date.localeCompare(b.date));
    setStrength(next);
    setEditingStrength(null);
    await apiSend({ type: "strength", action: isUpdate ? "update" : "create", entry });
  };
  const deleteStrength = async (id) => {
    const next = strength.filter((e) => e.id !== id);
    setStrength(next);
    await apiSend({ type: "strength", action: "delete", id });
  };
  const saveRun = async (entry) => {
    const isUpdate = runs.some((e) => e.id === entry.id);
    const next = (isUpdate ? runs.map((e) => (e.id === entry.id ? entry : e)) : [...runs, entry])
      .sort((a, b) => a.date.localeCompare(b.date));
    setRuns(next);
    setEditingRun(null);
    await apiSend({ type: "runs", action: isUpdate ? "update" : "create", entry });
  };
  const deleteRun = async (id) => {
    const next = runs.filter((e) => e.id !== id);
    setRuns(next);
    await apiSend({ type: "runs", action: "delete", id });
  };

  const showMsg = (text, tone = "good") => {
    setDataMsg({ text, tone });
    setTimeout(() => setDataMsg(null), 3500);
  };

  const exportData = () => {
    try {
      const payload = {
        app: "project-bankai",
        exportedAt: new Date().toISOString(),
        strength,
        runs,
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `project-bankai-backup-${todayStr()}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showMsg("Backup downloaded — check your device's downloads or share sheet.", "good");
    } catch (e) {
      showMsg("Export failed — please try again.", "alert");
    }
  };

  const triggerImport = () => {
    if (fileInputRef.current) fileInputRef.current.click();
  };

  const handleImportFile = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = ""; // allow re-selecting the same file later
    if (!file) return;
    try {
      const text = await file.text();
      const parsed = JSON.parse(text);
      const importedStrength = Array.isArray(parsed.strength) ? parsed.strength : null;
      const importedRuns = Array.isArray(parsed.runs) ? parsed.runs : null;
      if (!importedStrength || !importedRuns) {
        showMsg("That file doesn't look like a Project Bankai backup.", "alert");
        return;
      }
      setStrength(importedStrength);
      setRuns(importedRuns);
      await Promise.all([
        apiSend({ type: "strength", action: "replaceAll", entries: importedStrength }),
        apiSend({ type: "runs", action: "replaceAll", entries: importedRuns }),
      ]);
      showMsg(`Imported ${importedStrength.length} strength session(s) and ${importedRuns.length} run(s).`, "good");
    } catch (e) {
      showMsg("Couldn't read that file — make sure it's a Project Bankai backup JSON.", "alert");
    }
  };

  const nav = [
    { id: "dashboard", label: "Dashboard", icon: LayoutDashboard },
    { id: "strength", label: "Strength Log", icon: Dumbbell },
    { id: "running", label: "Run Log", icon: Activity },
    { id: "progress", label: "Progression", icon: TrendingUp },
    { id: "coach", label: "Next Run", icon: Flag },
  ];

  return (
    <div className="pp">
      <style>{CSS}</style>

      <div className="pp-shell">
        <aside className="pp-rail">
          <div className="pp-rail-top">
            <div className="pp-brand">
              <span className="pp-brand-mark">PB</span>
              <div className="pp-brand-text">
                <div className="pp-brand-name">PROJECT BANKAI</div>
                <div className="pp-brand-sub">Strength &amp; Run Coach</div>
              </div>
            </div>
            <nav className="pp-nav">
              {nav.map((n) => (
                <button
                  key={n.id}
                  className={"pp-nav-btn" + (tab === n.id ? " active" : "")}
                  onClick={() => setTab(n.id)}
                >
                  <n.icon size={17} strokeWidth={2} />
                  <span>{n.label}</span>
                </button>
              ))}
            </nav>
          </div>
          <div className="pp-rail-footer">
            <RaceCountdown compact />
            <div className="pp-data-actions">
              <button className="pp-btn ghost small" onClick={exportData}><Download size={13} /><span> Export</span></button>
              <button className="pp-btn ghost small" onClick={triggerImport}><Upload size={13} /><span> Import</span></button>
            </div>
          </div>
          <input
            type="file"
            accept="application/json"
            ref={fileInputRef}
            onChange={handleImportFile}
            style={{ display: "none" }}
          />
        </aside>

        <main className="pp-main">
          {dataMsg && (
            <div className={"pp-toast " + dataMsg.tone}>{dataMsg.text}</div>
          )}
          {!ready ? (
            <div className="pp-loading">Loading your log…</div>
          ) : (
            <>
              {tab === "dashboard" && (
                <Dashboard strength={strength} runs={runs} onLogLift={() => setEditingStrength({})} onLogRun={() => setEditingRun({})} />
              )}
              {tab === "strength" && (
                <StrengthLog entries={strength} onAdd={() => setEditingStrength({})} onEdit={(entry) => setEditingStrength(entry)} onDelete={deleteStrength} />
              )}
              {tab === "running" && (
                <RunLog entries={runs} onAdd={() => setEditingRun({})} onEdit={(entry) => setEditingRun(entry)} onDelete={deleteRun} />
              )}
              {tab === "progress" && <Progression strength={strength} runs={runs} />}
              {tab === "coach" && <NextRunCoach runs={runs} />}
            </>
          )}
        </main>
      </div>

      {editingStrength && <StrengthForm initialEntry={editingStrength.id ? editingStrength : null} onSave={saveStrength} onClose={() => setEditingStrength(null)} />}
      {editingRun && <RunForm initialEntry={editingRun.id ? editingRun : null} onSave={saveRun} onClose={() => setEditingRun(null)} />}
    </div>
  );
}

/* ======================================================================
   RACE COUNTDOWN (signature element)
   ====================================================================== */

function RaceCountdown({ compact }) {
  const next = RACES.map((r) => ({ ...r, d: daysUntil(r.date) })).filter((r) => r.d >= 0).sort((a, b) => a.d - b.d)[0] || RACES[RACES.length - 1];
  const digits = String(Math.max(next.d, 0)).padStart(3, "0").split("");
  return (
    <div className={"pp-countdown" + (compact ? " compact" : "")}>
      <div className="pp-countdown-label">{next.d >= 0 ? "days to" : "since"} {next.name}</div>
      <div className="pp-countdown-digits">
        {digits.map((d, i) => <span key={i} className="pp-digit">{d}</span>)}
      </div>
      <div className="pp-countdown-date">{fmtDate(next.date)} · goal 1:15:00 · 4:50/km × 8 rounds</div>
    </div>
  );
}

/* ======================================================================
   PACE RING (signature element)
   ====================================================================== */

function PaceRing({ paceSec, label }) {
  const size = 132, stroke = 10, r = (size - stroke) / 2, c = 2 * Math.PI * r;
  const hasData = paceSec != null;
  const ratio = hasData ? Math.min(GOAL_PACE_SEC / paceSec, 1.25) : 0;
  const pct = Math.min(ratio, 1);
  const onGoal = hasData && paceSec <= GOAL_PACE_SEC + 3;
  return (
    <div className="pp-ring-wrap">
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
        <circle cx={size / 2} cy={size / 2} r={r} stroke="var(--border)" strokeWidth={stroke} fill="none" />
        {hasData && (
          <circle
            cx={size / 2} cy={size / 2} r={r}
            stroke={onGoal ? "var(--teal)" : "var(--gold)"}
            strokeWidth={stroke} fill="none" strokeLinecap="round"
            strokeDasharray={c} strokeDashoffset={c * (1 - pct)}
            transform={`rotate(-90 ${size / 2} ${size / 2})`}
          />
        )}
        <text x="50%" y="46%" textAnchor="middle" className="pp-ring-num">{hasData ? secToPace(paceSec) : "--:--"}</text>
        <text x="50%" y="63%" textAnchor="middle" className="pp-ring-unit">min/km</text>
      </svg>
      <div className="pp-ring-label">{label}</div>
      <div className="pp-ring-target">target 4:50/km</div>
    </div>
  );
}

/* ======================================================================
   DASHBOARD
   ====================================================================== */

function Dashboard({ strength, runs, onLogLift, onLogRun }) {
  const now = new Date();
  const weekAgo = new Date(now); weekAgo.setDate(now.getDate() - 7);
  const monthAgo = new Date(now); monthAgo.setDate(now.getDate() - 30);
  const inRange = (d, from) => new Date(d + "T00:00:00") >= from;

  const strengthWeek = strength.filter((e) => inRange(e.date, weekAgo));
  const runsWeek = runs.filter((e) => inRange(e.date, weekAgo));
  const strengthMonth = strength.filter((e) => inRange(e.date, monthAgo));
  const runsMonth = runs.filter((e) => inRange(e.date, monthAgo));
  const distWeek = runsWeek.reduce((s, r) => s + Number(r.distance || 0), 0);
  const distMonth = runsMonth.reduce((s, r) => s + Number(r.distance || 0), 0);
  const trainingDays = new Set([...strengthWeek.map((e) => e.date), ...runsWeek.map((e) => e.date)]).size;
  const trainingDaysMonth = new Set([...strengthMonth.map((e) => e.date), ...runsMonth.map((e) => e.date)]).size;

  const bestByLift = (lift) => {
    const entries = strength.filter((e) => e.lift === lift);
    const best = entries.length ? Math.max(...entries.map(maxWeight)) : 0;
    return Math.max(best, BASELINE_PB[lift]);
  };
  const latestByLift = (lift) => {
    const entries = strength.filter((e) => e.lift === lift).sort((a, b) => b.date.localeCompare(a.date));
    return entries[0] || null;
  };

  const lastRun = [...runs].sort((a, b) => b.date.localeCompare(a.date))[0] || null;
  const lastRunPace = lastRun && lastRun.distance ? (lastRun.durationSec / lastRun.distance) : null;

  const recentRuns = [...runs].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 5);
  const near5k = recentRuns.filter((r) => Math.abs(r.distance - 5) <= 1).sort((a, b) => (a.durationSec / a.distance) - (b.durationSec / b.distance))[0];
  const near10k = recentRuns.filter((r) => Math.abs(r.distance - 10) <= 1.5).sort((a, b) => (a.durationSec / a.distance) - (b.durationSec / b.distance))[0];

  const lastStrengthDate = strength.length ? strength.map((e) => e.date).sort().slice(-1)[0] : null;
  const lastRunDate = runs.length ? runs.map((e) => e.date).sort().slice(-1)[0] : null;
  const strengthGapDays = lastStrengthDate ? daysSince(lastStrengthDate) : null;
  const runGapDays = lastRunDate ? daysSince(lastRunDate) : null;

  const summary = buildCoachingSummary({ strength, runs, lastRunPace, strengthGapDays, runGapDays });

  return (
    <div className="pp-page">
      <PageHeader
        title="Dashboard"
        sub="This week's snapshot, race clock, and where to focus next."
        actions={
          <>
            <button className="pp-btn primary" onClick={onLogLift}><Plus size={15} /> Log lift</button>
            <button className="pp-btn primary" onClick={onLogRun}><Plus size={15} /> Log run</button>
          </>
        }
      />

      <div className="pp-card pp-hero-card">
        <RaceCountdown />
      </div>

      <div className="pp-section-label">This week</div>
      <div className="pp-grid pp-grid-stats">
        <StatBlock value={strengthWeek.length} label="strength sessions" accent="gold" />
        <StatBlock value={runsWeek.length} label="runs completed" accent="teal" />
        <StatBlock value={`${distWeek.toFixed(1)} km`} label="running distance" accent="teal" />
        <StatBlock value={trainingDays} label="training days" accent="red" />
        <StatBlock value={7 - trainingDays > 0 ? 7 - trainingDays : 0} label="rest days" accent="dim" />
      </div>

      <div className="pp-section-label">This month</div>
      <div className="pp-grid pp-grid-stats">
        <StatBlock value={strengthMonth.length} label="strength sessions" accent="gold" />
        <StatBlock value={runsMonth.length} label="runs completed" accent="teal" />
        <StatBlock value={`${distMonth.toFixed(1)} km`} label="running distance" accent="teal" />
        <StatBlock value={trainingDaysMonth} label="training days" accent="red" />
        <StatBlock value={30 - trainingDaysMonth > 0 ? 30 - trainingDaysMonth : 0} label="rest days" accent="dim" />
      </div>

      <div className="pp-card pp-coach-card">
        <div className="pp-card-title"><Flag size={15} /> Running Coaching Summary</div>
        <ul className="pp-coach-list">
          {summary.map((s, i) => <li key={i}><span className={"pp-tag " + s.tone}>{s.tag}</span>{s.text}</li>)}
        </ul>
      </div>

      <div className="pp-stack">
        <div className="pp-card">
          <div className="pp-card-title"><Activity size={15} /> Running</div>
          <div className="pp-run-summary">
            <div><span className="pp-kv-label">Latest run</span><span className="pp-kv-val">{lastRun ? `${lastRun.distance}km · ${secToPace(lastRunPace)}/km · ${fmtShort(lastRun.date)}` : "none logged"}</span></div>
            <div><span className="pp-kv-label">Monthly distance</span><span className="pp-kv-val">{distMonth.toFixed(1)} km</span></div>
            <div><span className="pp-kv-label">Best 5k pace</span><span className="pp-kv-val">{near5k ? `${secToPace(near5k.durationSec / near5k.distance)}/km` : "no data"}</span></div>
            <div><span className="pp-kv-label">Best 10k pace</span><span className="pp-kv-val">{near10k ? `${secToPace(near10k.durationSec / near10k.distance)}/km` : "no data"}</span></div>
          </div>
        </div>

        <div className="pp-card">
          <div className="pp-card-title"><Dumbbell size={15} /> Strength</div>
          {LIFTS.map((lift) => {
            const latest = latestByLift(lift);
            const label = latest ? `${latest.variation} ${lift}` : lift;
            return (
              <div className="pp-lift-block" key={lift}>
                <div className="pp-lift-row">
                  <span className="pp-lift-name" style={{ color: LIFT_COLOR[lift] }}>{label}</span>
                  <span className="pp-lift-best">PB {bestByLift(lift)}kg</span>
                </div>
                {latest ? (
                  <div className="pp-lift-sets-detail">
                    {latest.sets.map((s, i) => `Set ${i + 1}: ${s.weight}kg / ${s.reps} reps`).join("  ·  ")}
                    <span className="pp-lift-sets-date"> · {fmtShort(latest.date)}</span>
                  </div>
                ) : (
                  <div className="pp-lift-sets-detail dim">not yet logged</div>
                )}
              </div>
            );
          })}
          <div className="pp-note"><AlertCircle size={13} /> Strength check-in scheduled 1 Jan 2027 — logging here keeps PBs accurate until then.</div>
        </div>
      </div>
    </div>
  );
}

function buildCoachingSummary({ strength, runs, lastRunPace, strengthGapDays, runGapDays }) {
  const out = [];
  if (lastRunPace != null) {
    const diff = lastRunPace - GOAL_PACE_SEC;
    if (diff <= 0) out.push({ tag: "GOING WELL", tone: "good", text: `Your last run held ${secToPace(lastRunPace)}/km — at or under your 4:50/km Hyrox target.` });
    else out.push({ tag: "WATCH", tone: "warn", text: `Last run was ${secToPace(lastRunPace)}/km, ${Math.round(diff)}s slower than the 4:50/km target you'll need across all 8 Hyrox rounds.` });
  } else {
    out.push({ tag: "NEEDS DATA", tone: "warn", text: "No runs logged yet — log a run so pace toward your 4:50/km Hyrox target can be tracked." });
  }
  if (runGapDays != null && runGapDays >= 6) {
    out.push({ tag: "CONSISTENCY", tone: "alert", text: `It's been ${runGapDays} days since your last logged run — with two Hyrox events on the calendar, running consistency is the priority lever right now.` });
  }
  if (strengthGapDays != null && strengthGapDays >= 10) {
    out.push({ tag: "CONSISTENCY", tone: "warn", text: `${strengthGapDays} days since a strength session was logged — fine if REVL classes are still happening, just log them to keep PB tracking accurate.` });
  }
  const priority = lastRunPace != null && lastRunPace > GOAL_PACE_SEC
    ? "Highest priority: a pace-focused session at or near 4:50/km this week (see Next Run tab) to close the gap before race day."
    : "Highest priority: keep the current running consistency — protect it from REVL fatigue by keeping midweek runs easy.";
  out.push({ tag: "PRIORITY", tone: "priority", text: priority });
  return out;
}

  const [variation, setVariation] = useState(initialEntry ? initialEntry.variation : VARIATION_OPTIONS[LIFTS[0]][0]);

    setLift(l);
    setVariation(VARIATION_OPTIONS[l][0]);

  const handleClassChange = (c) => {
    setClassName(c);
    const mappedLift = CLASS_TO_LIFT[c];
    setLift(mappedLift);
    setVariation(VARIATION_OPTIONS[mappedLift][0]);
  };

  const updateSet = (i, field, val) => setSets(sets.map((s, idx) => idx === i ? { ...s, [field]: val } : s));
  const addSetRow = () => setSets([...sets, { weight: "", reps: "" }]);
  const removeSetRow = (i) => setSets(sets.filter((_, idx) => idx !== i));

              <span className="pp-x">×</span>

function RunForm({ initialEntry, onSave, onClose }) {
  const isEdit = !!initialEntry;
  const initialIsInterval = isEdit && !!(initialEntry.laps && initialEntry.laps.length > 0);
  const [date, setDate] = useState(initialEntry ? initialEntry.date : todayStr());
  const [name, setName] = useState(initialEntry ? (initialEntry.name || "") : "");
  const [type, setType] = useState(initialEntry ? initialEntry.type : "Easy");
  const [distance, setDistance] = useState(initialEntry && !initialIsInterval ? String(initialEntry.distance) : "");
  const [duration, setDuration] = useState(initialEntry && !initialIsInterval ? fmtDuration(initialEntry.durationSec) : "");
  const [laps, setLaps] = useState(
    initialIsInterval
      ? initialEntry.laps.map((l) => ({ distance: String(l.distanceM), duration: fmtDuration(l.durationSec) }))
      : [{ distance: "", duration: "" }]
  );
  const [avgHR, setAvgHR] = useState(initialEntry && initialEntry.avgHR ? String(initialEntry.avgHR) : "");
  const [maxHR, setMaxHR] = useState(initialEntry && initialEntry.maxHR ? String(initialEntry.maxHR) : "");
  const [notes, setNotes] = useState(initialEntry ? (initialEntry.notes || "") : "");

  const isInterval = type === "Interval";

  const updateLap = (i, field, val) => setLaps(laps.map((l, idx) => idx === i ? { ...l, [field]: val } : l));
  const addLap = () => setLaps([...laps, { distance: "", duration: "" }]);
  const removeLap = (i) => setLaps(laps.filter((_, idx) => idx !== i));

  const cleanLaps = laps
    .filter((l) => l.distance && l.duration)
    .map((l) => ({ distanceM: Number(l.distance), durationSec: parseDurationToSec(l.duration) }))
    .filter((l) => l.durationSec != null);

  const lapTotalDistanceKm = cleanLaps.reduce((s, l) => s + l.distanceM, 0) / 1000;
  const lapTotalDurationSec = cleanLaps.reduce((s, l) => s + l.durationSec, 0);

  const durationSec = isInterval ? lapTotalDurationSec : parseDurationToSec(duration);
  const effectiveDistance = isInterval ? lapTotalDistanceKm : Number(distance);
  const pace = durationSec && effectiveDistance ? durationSec / effectiveDistance : null;
  const canSave = isInterval ? cleanLaps.length > 0 : (distance && durationSec);

  const handleSave = () => {
    if (!canSave) return;
    onSave({
      id: isEdit ? initialEntry.id : uid(), date, name, type,
      distance: isInterval ? Math.round(lapTotalDistanceKm * 1000) / 1000 : Number(distance),
      durationSec: isInterval ? lapTotalDurationSec : durationSec,
      laps: isInterval ? cleanLaps : null,
      avgHR: avgHR ? Number(avgHR) : null, maxHR: maxHR ? Number(maxHR) : null, notes,
    });
  };

  return (
    <div className="pp-modal-overlay" onClick={onClose}>
      <div className="pp-modal" onClick={(e) => e.stopPropagation()}>
        <div className="pp-modal-header">
          <h2><Activity size={16} /> {isEdit ? "Edit run" : "Log a run"}</h2>
          <button className="pp-icon-btn" onClick={onClose}><X size={18} /></button>
        </div>
        <div className="pp-modal-body">
          <div className="pp-form-row">
            <label>Date<input type="date" value={date} onChange={(e) => setDate(e.target.value)} /></label>
            <label>Session type
              <select value={type} onChange={(e) => setType(e.target.value)}>
                {RUN_TYPES.map((t) => <option key={t} value={t}>{t}</option>)}
              </select>
            </label>
          </div>
          <label className="pp-notes-label">Name / route<input type="text" placeholder="e.g. Sunday long run" value={name} onChange={(e) => setName(e.target.value)} /></label>

          {isInterval ? (
            <>
              <div className="pp-sets-label">Laps</div>
              {laps.map((l, i) => (
                <div className="pp-set-row" key={i}>
                  <span className="pp-lap-index">Lap {i + 1}</span>
                  <input type="number" placeholder="distance (m)" value={l.distance} onChange={(e) => updateLap(i, "distance", e.target.value)} />
                  <input type="text" placeholder="duration (mm:ss)" value={l.duration} onChange={(e) => updateLap(i, "duration", e.target.value)} />
                  {laps.length > 1 && <button className="pp-icon-btn small" onClick={() => removeLap(i)}><X size={14} /></button>}
                </div>
              ))}
              <button className="pp-btn ghost small" onClick={addLap}><Plus size={14} /> Add lap</button>
              {cleanLaps.length > 0 && (
                <div className="pp-pace-preview">
                  {cleanLaps.length} laps · {(lapTotalDistanceKm).toFixed(2)}km total · {fmtDuration(lapTotalDurationSec)} · avg <strong>{secToPace(pace)}/km</strong>
                  {pace <= GOAL_PACE_SEC ? " — at or under Hyrox target" : ` — ${Math.round(pace - GOAL_PACE_SEC)}s slower than 4:50/km target`}
                </div>
              )}
            </>
          ) : (
            <>
              <div className="pp-form-row">
                <label>Distance (km)<input type="number" step="0.01" placeholder="e.g. 8.2" value={distance} onChange={(e) => setDistance(e.target.value)} /></label>
                <label>Duration (mm:ss or h:mm:ss)<input type="text" placeholder="e.g. 42:30" value={duration} onChange={(e) => setDuration(e.target.value)} /></label>
              </div>
              {pace != null && <div className="pp-pace-preview">Average pace: <strong>{secToPace(pace)}/km</strong>{pace <= GOAL_PACE_SEC ? " — at or under Hyrox target" : ` — ${Math.round(pace - GOAL_PACE_SEC)}s slower than 4:50/km target`}</div>}
            </>
          )}

          <div className="pp-form-row">
            <label>Avg HR (optional)<input type="number" placeholder="bpm" value={avgHR} onChange={(e) => setAvgHR(e.target.value)} /></label>
            <label>Max HR (optional)<input type="number" placeholder="bpm" value={maxHR} onChange={(e) => setMaxHR(e.target.value)} /></label>
          </div>
          <label className="pp-notes-label">Notes<textarea rows={2} placeholder="Effort, weather, how it felt (splits/laps if you have them)" value={notes} onChange={(e) => setNotes(e.target.value)} /></label>
        </div>
        <div className="pp-modal-footer">
          <button className="pp-btn" onClick={onClose}>Cancel</button>
          <button className="pp-btn primary" disabled={!canSave} onClick={handleSave}>{isEdit ? "Save changes" : "Save run"}</button>
        </div>
      </div>
    </div>
  );
}

/* ======================================================================
   PROGRESSION (charts)
   ====================================================================== */

function Progression({ strength, runs }) {
  const oneRMData = useMemo(() => {
    const byDate = {};
    strength.forEach((e) => {
      const v = Math.round(maxSetLoad(e));
      if (!byDate[e.date]) byDate[e.date] = { date: e.date };
      byDate[e.date][e.lift] = byDate[e.date][e.lift] ? Math.max(byDate[e.date][e.lift], v) : v;
    });
    return Object.values(byDate).sort((a, b) => a.date.localeCompare(b.date)).map((d) => ({ ...d, label: fmtShort(d.date) }));
  }, [strength]);

  const volumeData = useMemo(() => {
    const byDate = {};
    strength.forEach((e) => {
      byDate[e.date] = (byDate[e.date] || 0) + volume(e);
    });
    return Object.entries(byDate).sort(([a], [b]) => a.localeCompare(b)).map(([date, vol]) => ({ label: fmtShort(date), volume: vol }));
  }, [strength]);

  const weeklyDistance = useMemo(() => {
    const byWeek = {};
    runs.forEach((r) => {
      const d = new Date(r.date + "T00:00:00");
      const monday = new Date(d); monday.setDate(d.getDate() - ((d.getDay() + 6) % 7));
      const key = monday.toISOString().slice(0, 10);
      byWeek[key] = (byWeek[key] || 0) + Number(r.distance || 0);
    });
    return Object.entries(byWeek).sort(([a], [b]) => a.localeCompare(b)).map(([week, dist]) => ({ label: `wk ${fmtShort(week)}`, distance: Math.round(dist * 10) / 10 }));
  }, [runs]);

  const paceScatter = useMemo(() => {
    return runs.filter((r) => r.distance).map((r) => ({
      date: r.date, label: fmtShort(r.date),
      pace: Math.round((r.durationSec / r.distance)),
      type: r.type,
    })).sort((a, b) => a.date.localeCompare(b.date));
  }, [runs]);

  const hasStrength = strength.length > 0;
  const hasRuns = runs.length > 0;

  return (
    <div className="pp-page">
      <PageHeader title="Progression" sub="Estimated 1RM, training volume, weekly distance, and pace trend." />

      <div className="pp-card">
        <div className="pp-card-title"><Dumbbell size={15} /> Estimated 1RM trend (Epley)</div>
        {!hasStrength ? <EmptyState icon={Dumbbell} text="Log a few strength sessions to see your 1RM trend." /> : (
          <ResponsiveContainer width="100%" height={230}>
            <LineChart data={oneRMData}>
              <CartesianGrid strokeDasharray="3 3" stroke="var(--border)" />
              <XAxis dataKey="label" stroke="var(--dim)" fontSize={11} />
              <YAxis stroke="var(--dim)" fontSize={11} unit="kg" />
              <Tooltip contentStyle={TOOLTIP_STYLE} />
              <Legend wrapperStyle={{ fontSize: 12 }} />
              {LIFTS.map((l) => <Line key={l} type="monotone" dataKey={l} stroke={LIFT_COLOR[l].replace("var(--", "").replace(")", "")} connectNulls name={l} dot={{ r: 3 }} strokeWidth={2} />)}
            </LineChart>
          </ResponsiveContainer>
        )}
      </div>

      <div className="pp-card">
        <div className="pp-card-title"><TrendingUp size={15} /> Training volume per session (kg lifted)</div>
        {!hasStrength ? <EmptyState icon={TrendingUp} text="No volume data yet." /> : (
          <ResponsiveContainer width="100%" height={200}>
            <BarChart data={volumeData}>
              <CartesianGrid strokeDasharray="3 3" stroke="var(--border)" />
              <XAxis dataKey="label" stroke="var(--dim)" fontSize={11} />
              <YAxis stroke="var(--dim)" fontSize={11} />
              <Tooltip contentStyle={TOOLTIP_STYLE} />
              <Bar dataKey="volume" fill="#E8B33D" radius={[3, 3, 0, 0]} />
            </BarChart>
          </ResponsiveContainer>
        )}
      </div>

      <div className="pp-card">
        <div className="pp-card-title"><Activity size={15} /> Weekly running distance</div>
        {!hasRuns ? <EmptyState icon={Activity} text="No running data yet." /> : (
          <ResponsiveContainer width="100%" height={200}>
            <BarChart data={weeklyDistance}>
              <CartesianGrid strokeDasharray="3 3" stroke="var(--border)" />
              <XAxis dataKey="label" stroke="var(--dim)" fontSize={11} />
              <YAxis stroke="var(--dim)" fontSize={11} unit="km" />
              <Tooltip contentStyle={TOOLTIP_STYLE} />
              <Bar dataKey="distance" fill="#2FD9C4" radius={[3, 3, 0, 0]} />
            </BarChart>
          </ResponsiveContainer>
        )}
      </div>

      <div className="pp-card">
        <div className="pp-card-title"><Timer size={15} /> Pace trend vs 4:50/km Hyrox target</div>
        {!hasRuns ? <EmptyState icon={Timer} text="No pace data yet." /> : (
          <ResponsiveContainer width="100%" height={220}>
            <ScatterChart>
              <CartesianGrid strokeDasharray="3 3" stroke="var(--border)" />
              <XAxis dataKey="label" type="category" allowDuplicatedCategory={false} stroke="var(--dim)" fontSize={11} />
              <YAxis dataKey="pace" reversed tickFormatter={secToPace} stroke="var(--dim)" fontSize={11} />
              <Tooltip contentStyle={TOOLTIP_STYLE} formatter={(v) => secToPace(v) + "/km"} />
              <ReferenceLine y={GOAL_PACE_SEC} stroke="var(--teal)" strokeDasharray="4 4" label={{ value: "4:50 target", fill: "var(--teal)", fontSize: 11, position: "insideTopLeft" }} />
              <Scatter data={paceScatter} fill="#FF4433" />
            </ScatterChart>
          </ResponsiveContainer>
        )}
        <div className="pp-chart-note">Lower on the chart = faster. Comparisons across very different session types (intervals vs long runs) should be read with care — they're not directly comparable.</div>
      </div>
    </div>
  );
}

const TOOLTIP_STYLE = { background: "#1F232A", border: "1px solid #2B2E36", borderRadius: 8, fontSize: 12, color: "#ECEBE6" };

/* ======================================================================

   ====================================================================== */

function NextRunCoach({ runs }) {
  const sorted = [...runs].sort((a, b) => b.date.localeCompare(a.date));
  const last = sorted[0] || null;
  const last3 = sorted.slice(0, 3);
  const last7dDist = runs.filter((r) => daysSince(r.date) <= 7).reduce((s, r) => s + Number(r.distance || 0), 0);
  const lastWasHard = last && (last.type === "Interval" || last.type === "Tempo" || last.type === "Threshold" || last.type === "Race") && daysSince(last.date) <= 2;

  const last3Paces = last3.map((r) => r.durationSec / r.distance);
  const avgRecentPace = last3Paces.length ? last3Paces.reduce((s, p) => s + p, 0) / last3Paces.length : null;
  const last3Summary = last3.map((r) => `${fmtShort(r.date)} ${secToPace(r.durationSec / r.distance)}/km`).join(", ");

  const STRETCH_PACE_SEC = GOAL_PACE_SEC - 10; // 4:40/km — the next tier once 4:50 is consistently beaten

  let rec;
  if (runs.length < 3) {
    rec = {
      objective: "Build a baseline",
      specifics: "Run 5km at a controlled, comfortable effort — don't chase pace yet.",
      distanceLine: "5 km, no pace target",
      why: `Only ${runs.length} run(s) logged so far — not enough history to prescribe a pace yet. This run establishes that baseline; from your next 3 runs onward, I'll prescribe an exact pace and distance.`,
      record: "Distance, duration, and how the effort felt.",
    };
  } else if (lastWasHard) {
    rec = {
      objective: "Recovery run",
      specifics: "Run 4km easy. Do not watch pace on this one — effort only.",
      distanceLine: "4 km easy",
      why: `Your last logged session (${last.type}, ${fmtShort(last.date)}) was high-intensity within the last 2 days. Combined with REVL load, this session is mandatory recovery, not optional — running hard again today would blunt tomorrow's quality.`,
      record: "Duration and how recovered you felt.",
    };
  } else if (avgRecentPace && avgRecentPace > GOAL_PACE_SEC + 15) {
    rec = {
      objective: `Interval work at ${secToPace(GOAL_PACE_SEC)}/km`,
      specifics: `Run 6 × 1km at ${secToPace(GOAL_PACE_SEC)}/km pace, with 90 seconds of easy jog recovery between each rep. Warm up 1km easy first, cool down 1km easy after.`,
      distanceLine: `8 km total @ ${secToPace(GOAL_PACE_SEC)}/km on the reps`,
      why: `Your last 3 runs (${last3Summary}) averaged ${secToPace(avgRecentPace)}/km — ${Math.round(avgRecentPace - GOAL_PACE_SEC)}s slower than the ${secToPace(GOAL_PACE_SEC)}/km target you need across all 8 Hyrox rounds. Broken reps at target pace close that gap without the fatigue cost of a continuous effort at the same speed.`,
      record: "Pace for every rep, and whether reps 5-6 held pace or faded.",
    };
  } else if (avgRecentPace && avgRecentPace > GOAL_PACE_SEC) {
    rec = {
      objective: `Hold ${secToPace(GOAL_PACE_SEC)}/km continuously`,
      specifics: `Run 6km continuously at ${secToPace(GOAL_PACE_SEC)}/km pace — no walk breaks, no easing off after halfway.`,
      distanceLine: `6 km @ ${secToPace(GOAL_PACE_SEC)}/km`,
      why: `Your last 3 runs (${last3Summary}) averaged ${secToPace(avgRecentPace)}/km — close to target but not there continuously. You've done the broken-rep work; now prove you can hold ${secToPace(GOAL_PACE_SEC)}/km for a full sustained effort, which is what race day actually demands.`,
      record: "Pace at each kilometre split, and RPE at the finish.",
    };
  } else {
    rec = {
      objective: `Push past target — ${secToPace(STRETCH_PACE_SEC)}/km`,
      specifics: `Run 5 × 1km at ${secToPace(STRETCH_PACE_SEC)}/km pace, with 90 seconds jog recovery between reps. Warm up 1km easy first, cool down 1km easy after.`,
      distanceLine: `7 km total @ ${secToPace(STRETCH_PACE_SEC)}/km on the reps`,
      why: `Your last 3 runs (${last3Summary}) averaged ${secToPace(avgRecentPace)}/km — already at or under your ${secToPace(GOAL_PACE_SEC)}/km target. Sitting at that pace won't make you faster. The new target is ${secToPace(STRETCH_PACE_SEC)}/km — this session moves you toward it.`,
      record: "Pace for every rep, and whether you could have held one more.",
    };
  }

  return (
    <div className="pp-page">
      <PageHeader title="Next Run" sub="Your prescribed session, based on your last 3 logged runs." />

      <div className="pp-card pp-rec-card">
        <div className="pp-rec-objective">{rec.objective}</div>
        <div className="pp-rec-distance"><Timer size={16} /> {rec.distanceLine}</div>
        <div className="pp-rec-block">
          <div className="pp-rec-label">Do this</div>
          <div>{rec.specifics}</div>
        </div>
        <div className="pp-rec-block">
          <div className="pp-rec-label">Why this, why now</div>
          <div>{rec.why}</div>
        </div>
        <div className="pp-rec-block">
          <div className="pp-rec-label">What to record afterward</div>
          <div>{rec.record}</div>
        </div>
        <div className="pp-rec-footnote">Last 7 days: {last7dDist.toFixed(1)}km logged. REVL strength/cardio classes provide the rest of your conditioning load — this prescription assumes those continue as scheduled.</div>
      </div>
    </div>
  );
}
