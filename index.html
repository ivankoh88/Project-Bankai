<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;
const {
  ResponsiveContainer, LineChart, Line, XAxis, YAxis, CartesianGrid,
  Tooltip, Legend, BarChart, Bar, ReferenceLine, ScatterChart, Scatter, Cell,
} = Recharts;

/* ------------------------- lightweight icon set (replaces lucide-react) ------------------------- */
function Icon({ children, size = 16, strokeWidth = 2, style, ...rest }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
      strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round"
      style={{ display: "inline-block", verticalAlign: "middle", flexShrink: 0, ...style }} {...rest}>
      {children}
    </svg>
  );
}
const Plus = (p) => <Icon {...p}><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></Icon>;
const X = (p) => <Icon {...p}><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></Icon>;
const ChevronRight = (p) => <Icon {...p}><polyline points="9 18 15 12 9 6" /></Icon>;
const Download = (p) => <Icon {...p}><path d="M12 3v12" /><polyline points="7 11 12 16 17 11" /><path d="M5 19h14" /></Icon>;
const Upload = (p) => <Icon {...p}><path d="M12 19V7" /><polyline points="7 12 12 7 17 12" /><path d="M5 19h14" /></Icon>;
const Timer = (p) => <Icon {...p}><circle cx="12" cy="13" r="8" /><path d="M12 9v4l3 2" /><path d="M9 2h6" /></Icon>;
const TrendingUp = (p) => <Icon {...p}><polyline points="3 17 9 11 13 15 21 6" /><polyline points="15 6 21 6 21 12" /></Icon>;
const Activity = (p) => <Icon {...p}><polyline points="2 12 7 12 10 20 14 4 17 12 22 12" /></Icon>;
const LayoutDashboard = (p) => <Icon {...p}><rect x="3" y="3" width="7" height="9" rx="1" /><rect x="14" y="3" width="7" height="5" rx="1" /><rect x="14" y="12" width="7" height="9" rx="1" /><rect x="3" y="16" width="7" height="5" rx="1" /></Icon>;
const Flag = (p) => <Icon {...p}><path d="M5 21V4" /><path d="M5 4h13l-3 4 3 4H5" /></Icon>;
const AlertCircle = (p) => <Icon {...p}><circle cx="12" cy="12" r="9" /><line x1="12" y1="8" x2="12" y2="13" /><line x1="12" y1="16.5" x2="12" y2="16.6" /></Icon>;
const Trash2 = (p) => <Icon {...p}><path d="M4 7h16" /><path d="M9 7V4h6v3" /><path d="M6 7l1 13h10l1-13" /><line x1="10" y1="11" x2="10" y2="17" /><line x1="14" y1="11" x2="14" y2="17" /></Icon>;
const Dumbbell = (p) => <Icon {...p}><path d="M4 12h16" /><path d="M4 9v6" /><path d="M20 9v6" /><path d="M7 7v10" /><path d="M17 7v10" /></Icon>;
const Pencil = (p) => <Icon {...p}><path d="M12 20h9" /><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z" /></Icon>;
const Heart = (p) => <Icon {...p}><path d="M19 14c1.5-1.4 3-3.2 3-5.5A4.5 4.5 0 0 0 17.5 4c-1.7 0-3 .8-4.5 2.5C11.5 4.8 10.2 4 8.5 4A4.5 4.5 0 0 0 4 8.5c0 2.3 1.5 4.1 3 5.5l7 6.5z" /></Icon>;
const Moon = (p) => <Icon {...p}><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z" /></Icon>;


/* ---------------------------------- constants ---------------------------------- */

const LIFTS = ["Deadlift", "Bench Press", "Squat"];
const LIFT_COLOR = { "Deadlift": "var(--red)", "Bench Press": "var(--gold)", "Squat": "var(--violet)" };
const BASELINE_PB = { "Deadlift": 170, "Bench Press": 80, "Squat": 142.5 };
const RACES = [
  { name: "Hyrox Doubles #1", date: "2026-11-21" },
  { name: "Hyrox Doubles #2", date: "2026-12-12" },
];
const GOAL_PACE_SEC = 4 * 60 + 50; // 4:50/km
const CLASS_OPTIONS = ["Move Total", "Move Upper", "Move Lower"];
const CLASS_TO_LIFT = { "Move Total": "Deadlift", "Move Upper": "Bench Press", "Move Lower": "Squat" };
const VARIATION_OPTIONS = {
  "Deadlift": ["Conventional", "Romanian"],
  "Bench Press": ["Conventional", "Incline"],
  "Squat": ["Back", "Front"],
};

// Paste your deployed Google Apps Script Web App URL here (see paceplate-sheets-backend.gs)
const SHEETS_API_URL = "https://script.google.com/macros/s/AKfycbwXPitKjHqDXbGA_hZ6_euKaXFHZtVq0HUQ9sQSTKE2AZys2icuqsNh4ODFsZMvI43uXA/exec";

// Garmin recovery data, synced daily by a separate GitHub Actions pipeline (garmin-ai repo),
// which pushes data.json directly into this repo alongside index.html.
const GARMIN_DATA_URL = "./data.json";

/* ----------------------------------- helpers ------------------------------------ */

const uid = () => Math.random().toString(36).slice(2, 10);
const todayStr = () => new Date().toISOString().slice(0, 10);
const fmtDate = (d) => new Date(d + "T00:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
const fmtShort = (d) => new Date(d + "T00:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short" });
const daysUntil = (d) => Math.ceil((new Date(d + "T00:00:00") - new Date(new Date().toDateString())) / 86400000);

// Garmin activities key off start_local ("2026-08-01 06:07:27"), not the plain
// yyyy-MM-dd string every date helper above expects — these adapt it.
const activityDate = (a) => (a && a.start_local ? a.start_local.slice(0, 10) : null);
const activityDistanceKm = (a) => (a && a.distance_m ? a.distance_m / 1000 : 0);
const activityPaceSec = (a) => (a && a.distance_m ? a.duration_seconds / (a.distance_m / 1000) : null);

function secToPace(sec) {
  if (sec == null || isNaN(sec)) return "--:--";
  // Round the total first, then split — rounding minutes/seconds separately can
  // carry a rounded-up 60s into the wrong minute (e.g. "5:60" instead of "6:00"),
  // which only shows up with fractional-second data like Garmin's.
  const total = Math.round(sec);
  const m = Math.floor(total / 60);
  const s = total % 60;
  return `${m}:${String(s).padStart(2, "0")}`;
}
function fmtDuration(sec) {
  if (sec == null || isNaN(sec)) return "--";
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = Math.round(sec % 60);
  return h > 0 ? `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}` : `${m}:${String(s).padStart(2, "0")}`;
}
const epley1RM = (w, r) => (w && r ? w * (1 + r / 30) : 0);
const maxSetLoad = (entry) => entry.sets.reduce((best, s) => Math.max(best, epley1RM(Number(s.weight), Number(s.reps))), 0);
const maxWeight = (entry) => entry.sets.reduce((best, s) => Math.max(best, Number(s.weight) || 0), 0);
const volume = (entry) => entry.sets.reduce((v, s) => v + (Number(s.weight) || 0) * (Number(s.reps) || 0), 0);
const daysSince = (d) => Math.floor((new Date(new Date().toDateString()) - new Date(d + "T00:00:00")) / 86400000);

// Local (not UTC) yyyy-MM-dd -- toISOString() is UTC and can land on the wrong
// calendar day depending on timezone offset (e.g. any time before 8am in
// Singapore, UTC is still "yesterday").
const toLocalDateStr = (d) => {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
};
// Monday-start calendar week (weekly stats app-wide run Mon-Sun, not a rolling
// 7-day window), as a yyyy-MM-dd string for the Monday of the week containing `d`.
const mondayOfWeekStr = (d) => {
  const date = new Date(d);
  const day = date.getDay(); // 0=Sun..6=Sat
  const diff = day === 0 ? -6 : 1 - day;
  date.setDate(date.getDate() + diff);
  return toLocalDateStr(date);
};

/* ------------------------------------ storage (Google Sheets backend) ------------------------------------ */

// Normalizes a date value to a plain "yyyy-MM-dd" string. Handles both the
// correct plain-string case and the case where Sheets/Apps Script hands back
// a full ISO timestamp (e.g. "2026-07-31T16:00:00.000Z") — using the browser's
// LOCAL date components (not a raw string slice) so a timezone offset doesn't
// silently shift the date back a day.
function normalizeDateStr(d) {
  if (!d) return d;
  if (typeof d === "string" && /^\d{4}-\d{2}-\d{2}$/.test(d)) return d; // already plain
  const dt = new Date(d);
  if (isNaN(dt.getTime())) return d;
  const y = dt.getFullYear();
  const m = String(dt.getMonth() + 1).padStart(2, "0");
  const day = String(dt.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

async function apiFetch(type) {
  try {
    const res = await fetch(`${SHEETS_API_URL}?type=${type}`);
    const data = await res.json();
    const arr = Array.isArray(data) ? data : [];
    return arr.map((entry) => ({ ...entry, date: normalizeDateStr(entry.date) }));
  } catch (e) {
    console.error("Project Bankai: failed to load", type, e);
    return [];
  }
}

// Uses text/plain content-type deliberately: Apps Script web apps don't handle
// CORS preflight (OPTIONS) requests, and application/json triggers one. Sending
// as text/plain avoids the preflight while the body is still parsed as JSON
// server-side (see doPost in paceplate-sheets-backend.gs).
async function apiSend(payload) {
  try {
    const res = await fetch(SHEETS_API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload),
    });
    if (!res.ok) {
      console.error("Project Bankai: sync returned HTTP error", res.status, payload);
      return false;
    }
    let json;
    try {
      json = await res.json();
    } catch (parseErr) {
      console.error("Project Bankai: sync response wasn't valid JSON (likely an Apps Script error page)", payload);
      return false;
    }
    if (!json || json.ok !== true) {
      console.error("Project Bankai: sync rejected by backend", json, payload);
      return false;
    }
    return true;
  } catch (e) {
    console.error("Project Bankai: failed to sync", payload, e);
    return false;
  }
}

/* ======================================================================
   APP
   ====================================================================== */

function App() {
  const [tab, setTab] = useState("dashboard");
  const [strength, setStrength] = useState([]);
  const [recovery, setRecovery] = useState({ wellness: [], activities: [] });
  const [ready, setReady] = useState(false);
  const [editingStrength, setEditingStrength] = useState(null); // null = closed; {} = new; entry = editing
  const [dataMsg, setDataMsg] = useState(null);
  const fileInputRef = React.useRef(null);

  // Recovery data loads independently of strength/runs — a Garmin fetch failure
  // shouldn't block the rest of the app from becoming ready.
  useEffect(() => {
    (async () => {
      try {
        const res = await fetch(GARMIN_DATA_URL, { cache: "no-store" });
        const data = await res.json();
        setRecovery({
          wellness: Array.isArray(data.wellness) ? data.wellness : [],
          activities: Array.isArray(data.activities) ? data.activities : [],
        });
      } catch (e) {
        console.error("Project Bankai: failed to load Garmin recovery data", e);
      }
    })();
  }, []);

  // Sole source of truth for running data: Garmin activities, filtered to running
  // types, capped at 60 days back, deduped by id (upstream sync already dedupes,
  // this is a second safety net), newest first. Computed once here and shared by
  // Dashboard, Run History, and Run Coach so the scoping logic never drifts.
  const runningActivities = useMemo(() => {
    const acts = Array.isArray(recovery.activities) ? recovery.activities : [];
    const cutoff = new Date(new Date().toDateString());
    cutoff.setDate(cutoff.getDate() - 60);
    const seen = new Set();
    return acts
      .filter((a) => a && typeof a.type === "string" && /running/i.test(a.type))
      .filter((a) => {
        const ds = activityDate(a);
        if (!ds) return false;
        const d = new Date(ds + "T00:00:00");
        return !isNaN(d) && d >= cutoff;
      })
      .filter((a) => {
        if (a.id == null) return true;
        if (seen.has(a.id)) return false;
        seen.add(a.id);
        return true;
      })
      .sort((a, b) => (b.start_local || "").localeCompare(a.start_local || ""));
  }, [recovery.activities]);

  useEffect(() => {
    (async () => {
      const s = await apiFetch("strength");
      setStrength(s.sort((a, b) => a.date.localeCompare(b.date)));
      setReady(true);
    })();
  }, []);

  const saveStrength = async (entry) => {
    const isUpdate = strength.some((e) => e.id === entry.id);
    const next = (isUpdate ? strength.map((e) => (e.id === entry.id ? entry : e)) : [...strength, entry])
      .sort((a, b) => a.date.localeCompare(b.date));
    setStrength(next);
    setEditingStrength(null);
    const ok = await apiSend({ type: "strength", action: isUpdate ? "update" : "create", entry });
    if (!ok) showMsg("Couldn't sync this lift to Google Sheets — it's showing here but may not be saved. Check your Apps Script deployment.", "alert");
  };
  const deleteStrength = async (id) => {
    const next = strength.filter((e) => e.id !== id);
    setStrength(next);
    const ok = await apiSend({ type: "strength", action: "delete", id });
    if (!ok) showMsg("Couldn't sync this deletion to Google Sheets — it may still exist there.", "alert");
  };
  const showMsg = (text, tone = "good") => {
    setDataMsg({ text, tone });
    setTimeout(() => setDataMsg(null), 3500);
  };

  const exportData = () => {
    try {
      const payload = {
        app: "project-bankai",
        exportedAt: new Date().toISOString(),
        strength,
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `project-bankai-backup-${todayStr()}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showMsg("Backup downloaded — check your device's downloads or share sheet.", "good");
    } catch (e) {
      showMsg("Export failed — please try again.", "alert");
    }
  };

  const triggerImport = () => {
    if (fileInputRef.current) fileInputRef.current.click();
  };

  const handleImportFile = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = ""; // allow re-selecting the same file later
    if (!file) return;
    try {
      const text = await file.text();
      const parsed = JSON.parse(text);
      const importedStrength = Array.isArray(parsed.strength) ? parsed.strength : null;
      if (!importedStrength) {
        showMsg("That file doesn't look like a Project Bankai backup.", "alert");
        return;
      }
      // Older backups may still have a `runs` key — it's ignored, not rejected.
      // Running data now comes solely from Garmin, so there's nothing to import it into.
      setStrength(importedStrength);
      const ok = await apiSend({ type: "strength", action: "replaceAll", entries: importedStrength });
      if (!ok) showMsg("Couldn't sync the import to Google Sheets — it's showing here but may not be saved.", "alert");
      else showMsg(`Imported ${importedStrength.length} strength session(s).`, "good");
    } catch (e) {
      showMsg("Couldn't read that file — make sure it's a Project Bankai backup JSON.", "alert");
    }
  };

  const nav = [
    { id: "dashboard", label: "Dashboard", icon: LayoutDashboard },
    { id: "recovery", label: "Recovery", icon: Heart },
    { id: "strength", label: "Strength Log", icon: Dumbbell },
    { id: "running", label: "Run History", icon: Activity },
    { id: "coach", label: "Coach", icon: Flag },
  ];

  return (
    <div className="pp">
      <style>{CSS}</style>

      <div className="pp-shell">
        <aside className="pp-rail">
          <div className="pp-rail-top">
            <div className="pp-brand">
              <span className="pp-brand-mark">PB</span>
              <div className="pp-brand-text">
                <div className="pp-brand-name">PROJECT BANKAI</div>
                <div className="pp-brand-sub">Strength &amp; Run Coach</div>
              </div>
            </div>
            <nav className="pp-nav">
              {nav.map((n) => (
                <button
                  key={n.id}
                  className={"pp-nav-btn" + (tab === n.id ? " active" : "")}
                  onClick={() => setTab(n.id)}
                >
                  <n.icon size={17} strokeWidth={2} />
                  <span>{n.label}</span>
                </button>
              ))}
            </nav>
          </div>
          <div className="pp-rail-footer">
            <RaceCountdown compact />
            <div className="pp-data-actions">
              <button className="pp-btn ghost small" onClick={exportData}><Download size={13} /><span> Export</span></button>
              <button className="pp-btn ghost small" onClick={triggerImport}><Upload size={13} /><span> Import</span></button>
            </div>
          </div>
          <input
            type="file"
            accept="application/json"
            ref={fileInputRef}
            onChange={handleImportFile}
            style={{ display: "none" }}
          />
        </aside>

        <main className="pp-main">
          {dataMsg && (
            <div className={"pp-toast " + dataMsg.tone}>{dataMsg.text}</div>
          )}
          {!ready ? (
            <div className="pp-loading">Loading your log…</div>
          ) : (
            <>
              {tab === "dashboard" && (
                <Dashboard strength={strength} runningActivities={runningActivities} onLogLift={() => setEditingStrength({})} />
              )}
              {tab === "recovery" && (
                <Recovery wellness={recovery.wellness} activities={recovery.activities} />
              )}
              {tab === "strength" && (
                <StrengthLog entries={strength} onAdd={() => setEditingStrength({})} onEdit={(entry) => setEditingStrength(entry)} onDelete={deleteStrength} />
              )}
              {tab === "running" && (
                <RunHistory runningActivities={runningActivities} />
              )}
              {tab === "coach" && <Coach runningActivities={runningActivities} strength={strength} />}
            </>
          )}
        </main>
      </div>

      {editingStrength && <StrengthForm initialEntry={editingStrength.id ? editingStrength : null} onSave={saveStrength} onClose={() => setEditingStrength(null)} />}
    </div>
  );
}

/* ======================================================================
   RACE COUNTDOWN (signature element)
   ====================================================================== */

function RaceCountdown({ compact }) {
  const next = RACES.map((r) => ({ ...r, d: daysUntil(r.date) })).filter((r) => r.d >= 0).sort((a, b) => a.d - b.d)[0] || RACES[RACES.length - 1];
  const digits = String(Math.max(next.d, 0)).padStart(3, "0").split("");
  return (
    <div className={"pp-countdown" + (compact ? " compact" : "")}>
      <div className="pp-countdown-label">{next.d >= 0 ? "days to" : "since"} {next.name}</div>
      <div className="pp-countdown-digits">
        {digits.map((d, i) => <span key={i} className="pp-digit">{d}</span>)}
      </div>
      <div className="pp-countdown-date">{fmtDate(next.date)} · goal 1:15:00 · 4:50/km × 8 rounds</div>
    </div>
  );
}

/* ======================================================================
   PACE RING (signature element)
   ====================================================================== */

function PaceRing({ paceSec, label }) {
  const size = 132, stroke = 10, r = (size - stroke) / 2, c = 2 * Math.PI * r;
  const hasData = paceSec != null;
  const ratio = hasData ? Math.min(GOAL_PACE_SEC / paceSec, 1.25) : 0;
  const pct = Math.min(ratio, 1);
  const onGoal = hasData && paceSec <= GOAL_PACE_SEC + 3;
  return (
    <div className="pp-ring-wrap">
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
        <circle cx={size / 2} cy={size / 2} r={r} stroke="var(--border)" strokeWidth={stroke} fill="none" />
        {hasData && (
          <circle
            cx={size / 2} cy={size / 2} r={r}
            stroke={onGoal ? "var(--teal)" : "var(--gold)"}
            strokeWidth={stroke} fill="none" strokeLinecap="round"
            strokeDasharray={c} strokeDashoffset={c * (1 - pct)}
            transform={`rotate(-90 ${size / 2} ${size / 2})`}
          />
        )}
        <text x="50%" y="46%" textAnchor="middle" className="pp-ring-num">{hasData ? secToPace(paceSec) : "--:--"}</text>
        <text x="50%" y="63%" textAnchor="middle" className="pp-ring-unit">min/km</text>
      </svg>
      <div className="pp-ring-label">{label}</div>
      <div className="pp-ring-target">target 4:50/km</div>
    </div>
  );
}

/* ======================================================================
   DASHBOARD
   ====================================================================== */

function Dashboard({ strength, runningActivities, onLogLift }) {
  const now = new Date();
  const mondayStr = mondayOfWeekStr(now); // calendar week, Monday-Sunday -- not a rolling 7 days
  const monthAgo = new Date(now); monthAgo.setDate(now.getDate() - 30);
  const inRange = (d, from) => d && new Date(d + "T00:00:00") >= from;
  const inCalendarWeek = (d) => d && d >= mondayStr;
  // How many days have actually elapsed since Monday (1 on Monday, up to 7 on
  // Sunday) -- "rest days" needs this instead of a fixed 7, since mid-week the
  // rest of the week hasn't happened yet.
  const daysElapsedThisWeek = Math.floor((new Date(now.toDateString()) - new Date(mondayStr + "T00:00:00")) / 86400000) + 1;

  const strengthWeek = strength.filter((e) => inCalendarWeek(e.date));
  const runsWeek = runningActivities.filter((a) => inCalendarWeek(activityDate(a)));
  const strengthMonth = strength.filter((e) => inRange(e.date, monthAgo));
  const runsMonth = runningActivities.filter((a) => inRange(activityDate(a), monthAgo));
  const distWeek = runsWeek.reduce((s, a) => s + activityDistanceKm(a), 0);
  const distMonth = runsMonth.reduce((s, a) => s + activityDistanceKm(a), 0);
  const trainingDays = new Set([...strengthWeek.map((e) => e.date), ...runsWeek.map(activityDate)]).size;
  const trainingDaysMonth = new Set([...strengthMonth.map((e) => e.date), ...runsMonth.map(activityDate)]).size;

  const bestByLift = (lift) => {
    const entries = strength.filter((e) => e.lift === lift);
    const best = entries.length ? Math.max(...entries.map(maxWeight)) : 0;
    return Math.max(best, BASELINE_PB[lift]);
  };
  const latestByLift = (lift) => {
    const entries = strength.filter((e) => e.lift === lift).sort((a, b) => b.date.localeCompare(a.date));
    return entries[0] || null;
  };

  const lastRun = runningActivities[0] || null;
  const lastRunPace = lastRun ? activityPaceSec(lastRun) : null;

  // "Best" paces search the full synced history (not just recent runs) and are split
  // outdoor vs treadmill — treadmill pace runs measurably easier than the same effort
  // outdoors (see effortAdjustedPaceSec in the Coach module), so blending them together
  // would overstate outdoor race-day fitness.
  const outdoorRuns = runningActivities.filter((a) => a.type !== "treadmill_running");
  const treadmillRuns = runningActivities.filter((a) => a.type === "treadmill_running");
  const bestNear = (pool, targetKm, toleranceKm) =>
    pool.filter((a) => Math.abs(activityDistanceKm(a) - targetKm) <= toleranceKm).sort((a, b) => activityPaceSec(a) - activityPaceSec(b))[0];
  const near5k = bestNear(outdoorRuns, 5, 1);
  const near5kTreadmill = bestNear(treadmillRuns, 5, 1);
  const near10k = bestNear(outdoorRuns, 10, 1.5);
  const near10kTreadmill = bestNear(treadmillRuns, 10, 1.5);

  const lastStrengthDate = strength.length ? strength.map((e) => e.date).sort().slice(-1)[0] : null;
  const lastRunDate = lastRun ? activityDate(lastRun) : null;
  const strengthGapDays = lastStrengthDate ? daysSince(lastStrengthDate) : null;
  const runGapDays = lastRunDate ? daysSince(lastRunDate) : null;

  const summary = buildCoachingSummary({ lastRunPace, strengthGapDays, runGapDays });

  return (
    <div className="pp-page">
      <PageHeader
        title="Dashboard"
        sub="This week's snapshot, race clock, and where to focus next."
        actions={
          <button className="pp-btn primary" onClick={onLogLift}><Plus size={15} /> Log lift</button>
        }
      />

      <div className="pp-card pp-hero-card">
        <RaceCountdown />
      </div>

      <div className="pp-section-label">This week</div>
      <div className="pp-grid pp-grid-stats">
        <StatBlock value={strengthWeek.length} label="strength sessions" accent="gold" />
        <StatBlock value={runsWeek.length} label="runs completed" accent="teal" />
        <StatBlock value={`${distWeek.toFixed(1)} km`} label="running distance" accent="teal" />
        <StatBlock value={trainingDays} label="training days" accent="red" />
        <StatBlock value={daysElapsedThisWeek - trainingDays > 0 ? daysElapsedThisWeek - trainingDays : 0} label="rest days" accent="dim" />
      </div>

      <div className="pp-section-label">This month</div>
      <div className="pp-grid pp-grid-stats">
        <StatBlock value={strengthMonth.length} label="strength sessions" accent="gold" />
        <StatBlock value={runsMonth.length} label="runs completed" accent="teal" />
        <StatBlock value={`${distMonth.toFixed(1)} km`} label="running distance" accent="teal" />
        <StatBlock value={trainingDaysMonth} label="training days" accent="red" />
        <StatBlock value={30 - trainingDaysMonth > 0 ? 30 - trainingDaysMonth : 0} label="rest days" accent="dim" />
      </div>

      <div className="pp-card pp-coach-card">
        <div className="pp-card-title"><Flag size={15} /> Running Coaching Summary</div>
        <ul className="pp-coach-list">
          {summary.map((s, i) => <li key={i}><span className={"pp-tag " + s.tone}>{s.tag}</span>{s.text}</li>)}
        </ul>
      </div>

      <div className="pp-stack">
        <div className="pp-card">
          <div className="pp-card-title"><Activity size={15} /> Running</div>
          <div className="pp-run-summary">
            <div><span className="pp-kv-label">Latest run</span><span className="pp-kv-val">{lastRun ? `${activityDistanceKm(lastRun).toFixed(2)}km · ${secToPace(lastRunPace)}/km · ${fmtShort(activityDate(lastRun))}` : "none synced yet"}</span></div>
            <div><span className="pp-kv-label">Monthly distance</span><span className="pp-kv-val">{distMonth.toFixed(1)} km</span></div>
            <div><span className="pp-kv-label">Best 5k pace</span><span className="pp-kv-val">{near5k ? `${secToPace(activityPaceSec(near5k))}/km` : "no data"}</span></div>
            <div><span className="pp-kv-label">Best 5k treadmill pace</span><span className="pp-kv-val">{near5kTreadmill ? `${secToPace(activityPaceSec(near5kTreadmill))}/km` : "no data"}</span></div>
            <div><span className="pp-kv-label">Best 10k pace</span><span className="pp-kv-val">{near10k ? `${secToPace(activityPaceSec(near10k))}/km` : "no data"}</span></div>
            <div><span className="pp-kv-label">Best 10k treadmill pace</span><span className="pp-kv-val">{near10kTreadmill ? `${secToPace(activityPaceSec(near10kTreadmill))}/km` : "no data"}</span></div>
          </div>
        </div>

        <div className="pp-card">
          <div className="pp-card-title"><Dumbbell size={15} /> Strength</div>
          {LIFTS.map((lift) => {
            const latest = latestByLift(lift);
            const label = latest ? `${latest.variation} ${lift}` : lift;
            return (
              <div className="pp-lift-block" key={lift}>
                <div className="pp-lift-row">
                  <span className="pp-lift-name" style={{ color: LIFT_COLOR[lift] }}>{label}</span>
                  <span className="pp-lift-best">PB {bestByLift(lift)}kg</span>
                </div>
                {latest ? (
                  <div className="pp-lift-sets-detail">
                    {latest.sets.map((s, i) => `Set ${i + 1}: ${s.weight}kg / ${s.reps} reps`).join("  ·  ")}
                    <span className="pp-lift-sets-date"> · {fmtShort(latest.date)}</span>
                  </div>
                ) : (
                  <div className="pp-lift-sets-detail dim">not yet logged</div>
                )}
              </div>
            );
          })}
          <div className="pp-note"><AlertCircle size={13} /> Strength check-in scheduled 1 Jan 2027 — logging here keeps PBs accurate until then.</div>
        </div>
      </div>
    </div>
  );
}

function buildCoachingSummary({ lastRunPace, strengthGapDays, runGapDays }) {
  const out = [];
  if (lastRunPace != null) {
    const diff = lastRunPace - GOAL_PACE_SEC;
    if (diff <= 0) out.push({ tag: "GOING WELL", tone: "good", text: `Your last run held ${secToPace(lastRunPace)}/km — at or under your 4:50/km Hyrox target.` });
    else out.push({ tag: "WATCH", tone: "warn", text: `Last run was ${secToPace(lastRunPace)}/km, ${Math.round(diff)}s slower than the 4:50/km target you'll need across all 8 Hyrox rounds.` });
  } else {
    out.push({ tag: "NEEDS DATA", tone: "warn", text: "No runs logged yet — log a run so pace toward your 4:50/km Hyrox target can be tracked." });
  }
  if (runGapDays != null && runGapDays >= 6) {
    out.push({ tag: "CONSISTENCY", tone: "alert", text: `It's been ${runGapDays} days since your last logged run — with two Hyrox events on the calendar, running consistency is the priority lever right now.` });
  }
  if (strengthGapDays != null && strengthGapDays >= 10) {
    out.push({ tag: "CONSISTENCY", tone: "warn", text: `${strengthGapDays} days since a strength session was logged — fine if REVL classes are still happening, just log them to keep PB tracking accurate.` });
  }
  const priority = lastRunPace != null && lastRunPace > GOAL_PACE_SEC
    ? "Highest priority: a pace-focused session at or near 4:50/km this week (see the Coach tab) to close the gap before race day."
    : "Highest priority: keep the current running consistency — protect it from REVL fatigue by keeping midweek runs easy.";
  out.push({ tag: "PRIORITY", tone: "priority", text: priority });
  return out;
}

function latestNonNullRecovery(wellness, field) {
  const sorted = [...wellness].sort((a, b) => b.date.localeCompare(a.date));
  for (const row of sorted) {
    if (row[field] !== null && row[field] !== undefined) return row;
  }
  return null;
}

  { label: "Resting HR", field: "resting_hr", unit: "bpm" },
  { label: "HRV", field: "hrv_avg_ms", unit: "ms" },
  { label: "Sleep", field: "sleep_seconds", unit: "h", fmt: (v) => (v / 3600).toFixed(1) },
  { label: "Body battery", field: "body_battery_high", unit: "" },
  { label: "Stress", field: "stress_avg", unit: "" },
  { label: "Readiness", field: "training_readiness", unit: "" },
  { label: "Steps", field: "steps", unit: "" },
];

function StrengthForm({ initialEntry, onSave, onClose }) {
  const isEdit = !!initialEntry;
  const [date, setDate] = useState(initialEntry ? initialEntry.date : todayStr());
  const [className, setClassName] = useState(initialEntry ? initialEntry.className : CLASS_OPTIONS[0]);
  const [lift, setLift] = useState(initialEntry ? initialEntry.lift : LIFTS[0]);
  const [variation, setVariation] = useState(initialEntry ? initialEntry.variation : VARIATION_OPTIONS[LIFTS[0]][0]);
  const [sets, setSets] = useState(initialEntry ? initialEntry.sets.map((s) => ({ weight: String(s.weight), reps: String(s.reps) })) : [{ weight: "", reps: "" }]);
  const [notes, setNotes] = useState(initialEntry ? (initialEntry.notes || "") : "");

  const handleLiftChange = (l) => {
    setLift(l);
    setVariation(VARIATION_OPTIONS[l][0]);
  };

  const handleClassChange = (c) => {
    setClassName(c);
    const mappedLift = CLASS_TO_LIFT[c];
    setLift(mappedLift);
    setVariation(VARIATION_OPTIONS[mappedLift][0]);
  };

  const updateSet = (i, field, val) => setSets(sets.map((s, idx) => idx === i ? { ...s, [field]: val } : s));
  const addSetRow = () => setSets([...sets, { weight: "", reps: "" }]);
  const removeSetRow = (i) => setSets(sets.filter((_, idx) => idx !== i));

  const canSave = sets.some((s) => s.weight && s.reps);

  const handleSave = () => {
    const cleanSets = sets.filter((s) => s.weight && s.reps).map((s) => ({ weight: Number(s.weight), reps: Number(s.reps) }));
    if (!cleanSets.length) return;
    onSave({ id: isEdit ? initialEntry.id : uid(), date, className, lift, variation, sets: cleanSets, notes });
  };

  return (
    <div className="pp-modal-overlay" onClick={onClose}>
      <div className="pp-modal" onClick={(e) => e.stopPropagation()}>
        <div className="pp-modal-header">
          <h2><Dumbbell size={16} /> {isEdit ? "Edit strength session" : "Log a strength session"}</h2>
          <button className="pp-icon-btn" onClick={onClose}><X size={18} /></button>
        </div>
        <div className="pp-modal-body">
          <div className="pp-form-row">
            <label>Date<input type="date" value={date} onChange={(e) => setDate(e.target.value)} /></label>
            <label>REVL class / workout name
              <select value={className} onChange={(e) => handleClassChange(e.target.value)}>
                {CLASS_OPTIONS.map((c) => <option key={c} value={c}>{c}</option>)}
              </select>
            </label>
          </div>
          <div className="pp-form-row">
            <label>Primary lift
              <select value={lift} onChange={(e) => handleLiftChange(e.target.value)}>
                {LIFTS.map((l) => <option key={l} value={l}>{l}</option>)}
              </select>
            </label>
            <label>Variation
              <select value={variation} onChange={(e) => setVariation(e.target.value)}>
                {VARIATION_OPTIONS[lift].map((v) => <option key={v} value={v}>{v}</option>)}
              </select>
            </label>
          </div>

          <div className="pp-sets-label">Sets</div>
          {sets.map((s, i) => (
            <div className="pp-set-row" key={i}>
              <input type="number" placeholder="weight (kg)" value={s.weight} onChange={(e) => updateSet(i, "weight", e.target.value)} />
              <span className="pp-x">×</span>
              <input type="number" placeholder="reps" value={s.reps} onChange={(e) => updateSet(i, "reps", e.target.value)} />
              {sets.length > 1 && <button className="pp-icon-btn small" onClick={() => removeSetRow(i)}><X size={14} /></button>}
            </div>
          ))}
          <button className="pp-btn ghost small" onClick={addSetRow}><Plus size={14} /> Add set</button>

          <label className="pp-notes-label">Notes<textarea rows={2} placeholder="How it felt, form cues, anything notable" value={notes} onChange={(e) => setNotes(e.target.value)} /></label>
        </div>
        <div className="pp-modal-footer">
          <button className="pp-btn" onClick={onClose}>Cancel</button>
          <button className="pp-btn primary" disabled={!canSave} onClick={handleSave}>{isEdit ? "Save changes" : "Save session"}</button>
        </div>
      </div>
    </div>
  );
}

      {selectedActivity && <RunDetailModal activity={selectedActivity} onClose={() => setSelectedActivity(null)} />}
    </div>
  );
}

/* ======================================================================
   COACH (Run Coach + Strength Coach placeholder)
   ====================================================================== */

const HARD_ANAEROBIC_TE = 2.5;
function isHardRun(a) {
  const te = a && a.training_effect_anaerobic;
  const pace = activityPaceSec(a);
  const teHard = typeof te === "number" && te >= HARD_ANAEROBIC_TE;
  const paceHard = pace != null && pace <= GOAL_PACE_SEC;
  return teHard || paceHard;
}

const AFTER_RUN_NOTE = "This syncs from your watch automatically — nothing to log. Come back for your next prescription once it lands.";

/* ---- coaching metric helpers ---- */

function volumeInWindow(runningActivities, days) {
  return runningActivities
    .filter((a) => daysSince(activityDate(a)) <= days)
    .reduce((s, a) => s + activityDistanceKm(a), 0);
}

// Acute:chronic workload ratio — standard sports-science injury-risk signal.
// >1.5 danger, 1.3-1.5 caution, 0.8-1.3 sweet spot, <0.8 informational only.
// Returns null (skip entirely) without enough history to make the ratio meaningful —
// one early run against a near-zero chronic baseline would otherwise spike a false
// "danger" reading.
function acuteChronicRatio(runningActivities) {
  const vol7 = volumeInWindow(runningActivities, 7);
  const vol28 = volumeInWindow(runningActivities, 28);
  const chronicWeekly = vol28 / 4;
  const oldest = runningActivities[runningActivities.length - 1];
  const historyDays = oldest ? daysSince(activityDate(oldest)) : 0;
  if (chronicWeekly < 0.5 || historyDays < 14 || runningActivities.length < 4) return null;
  return vol7 / chronicWeekly;
}

// Ivan's treadmill pace runs measurably faster than equivalent outdoor effort —
// not empirically calibrated, just a reasonable estimate. Applied before any
// treadmill-derived pace feeds into outdoor-goal-pace comparisons.
const TREADMILL_DISCOUNT_SEC = 15;
function effortAdjustedPaceSec(a) {
  const p = activityPaceSec(a);
  if (p == null) return null;
  return a && a.type === "treadmill_running" ? p + TREADMILL_DISCOUNT_SEC : p;
}

function stdevOf(arr) {
  if (arr.length < 2) return 0;
  const m = arr.reduce((s, v) => s + v, 0) / arr.length;
  const variance = arr.reduce((s, v) => s + (v - m) * (v - m), 0) / arr.length;
  return Math.sqrt(variance);
}

// Calendar (Monday-Sunday) run counts for the last n weeks, index 0 = this week
// (Monday through today, so it's partial until Sunday), index 1 = last full
// week, etc.
function lastNWeekRunCounts(runningActivities, n) {
  const mondayThisWeek = new Date(mondayOfWeekStr(new Date()) + "T00:00:00");
  const counts = [];
  for (let w = 0; w < n; w++) {
    const weekStart = new Date(mondayThisWeek); weekStart.setDate(mondayThisWeek.getDate() - w * 7);
    const weekEnd = new Date(mondayThisWeek); weekEnd.setDate(mondayThisWeek.getDate() - w * 7 + 6);
    const startStr = toLocalDateStr(weekStart);
    const endStr = toLocalDateStr(weekEnd);
    counts.push(
      runningActivities.filter((a) => {
        const d = activityDate(a);
        return d && d >= startStr && d <= endStr;
      }).length
    );
  }
  return counts;
}

function Coach({ runningActivities, strength }) {
  const [subTab, setSubTab] = useState("run");
  return (
    <div className="pp-page">
      <PageHeader title="Coach" sub="Run and strength coaching, built from your synced training data." />
      <div className="pp-subnav">
        <button className={"pp-subnav-btn" + (subTab === "run" ? " active" : "")} onClick={() => setSubTab("run")}>Run Coach</button>
        <button className={"pp-subnav-btn" + (subTab === "strength" ? " active" : "")} onClick={() => setSubTab("strength")}>Strength Coach</button>
      </div>
      {subTab === "run"
        ? <RunCoach runningActivities={runningActivities} strength={strength} />
        : <StrengthCoachPlaceholder strength={strength} />}
    </div>
  );
}

function RunCoach({ runningActivities, strength }) {
  const avg = (arr) => arr.reduce((s, v) => s + v, 0) / arr.length;

  const last = runningActivities[0] || null;

  /* ---- pace evidence: last 3 HARD-EFFORT runs only, treadmill-pace-adjusted. An easy jog ---- */
  /* ---- shouldn't dilute the read on race-pace fitness, and treadmill pace runs measurably ---- */
  /* ---- easier than the same effort outdoors (see effortAdjustedPaceSec). ---- */
  const recentHardRuns = runningActivities.filter(isHardRun).slice(0, 3);
  const recentHardPaces = recentHardRuns.map(effortAdjustedPaceSec).filter((p) => p != null);
  const avgRecentPace = recentHardPaces.length ? avg(recentHardPaces) : null;
  const recentHardSummary = recentHardRuns
    .map((a) => `${fmtShort(activityDate(a))} ${secToPace(effortAdjustedPaceSec(a))}/km${a.type === "treadmill_running" ? " (treadmill, adjusted)" : ""}`)
    .join(", ");
  const PACE_CONSISTENCY_THRESHOLD_SEC = 10; // estimate, not empirically calibrated — tune later
  const isConsistent = recentHardPaces.length < 2 ? true : stdevOf(recentHardPaces) <= PACE_CONSISTENCY_THRESHOLD_SEC;

  /* ---- ideal easy-effort pace: anchored to your own recent easy runs where you have ---- */
  /* ---- them, otherwise a standard easy-day offset off goal pace ---- */
  const recentEasyPaces = runningActivities
    .filter((a) => !isHardRun(a))
    .slice(0, 6)
    .map(activityPaceSec)
    .filter((p) => p != null);
  const historicalEasyPace = recentEasyPaces.length ? avg(recentEasyPaces) : null;
  const EASY_BUFFER_SEC = 75; // ~1:15/km slower than goal pace is a standard easy-day offset
  const easyPaceSec = historicalEasyPace != null
    ? Math.max(historicalEasyPace, GOAL_PACE_SEC + 45)
    : GOAL_PACE_SEC + EASY_BUFFER_SEC;
  const EASY_PACE_LABEL = `${secToPace(easyPaceSec)}/km or slower — easy, conversational effort`;

  /* ---- weekly structure: how many hard sessions already this (calendar, Mon-Sun) week? ---- */
  const mondayStr = mondayOfWeekStr(new Date());
  const runsWeek = runningActivities.filter((a) => activityDate(a) && activityDate(a) >= mondayStr);
  const hardRunsWeek = runsWeek.filter(isHardRun);
  const volWeekToDate = runsWeek.reduce((s, a) => s + activityDistanceKm(a), 0);

  /* ---- layoff detection ---- */
  const lastRunGapDays = last ? daysSince(activityDate(last)) : null;
  const isLayoff = lastRunGapDays != null && lastRunGapDays >= 5;

  /* ---- cross-reference strength: recent heavy session? ---- */
  const sortedStrength = [...strength].sort((a, b) => b.date.localeCompare(a.date));
  const lastStrength = sortedStrength[0] || null;
  const strengthGapDays = lastStrength ? daysSince(lastStrength.date) : null;
  const heavyStrengthRecent = lastStrength && strengthGapDays <= 1;
  const strengthCountWeek = strength.filter((e) => e.date >= mondayStr).length;

  /* ---- pace trend: last 3 hard-effort runs vs the 3 before that (same treadmill-adjusted ---- */
  /* ---- basis as avgRecentPace, so the TREND tag and the pace evidence text never disagree) ---- */
  const priorHardRuns = runningActivities.filter(isHardRun).slice(3, 6);
  const priorPaces = priorHardRuns.map(effortAdjustedPaceSec).filter((p) => p != null);
  const priorAvgPace = priorPaces.length ? avg(priorPaces) : null;
  let trend = null;
  if (avgRecentPace != null && priorAvgPace != null) {
    const improvementSec = priorAvgPace - avgRecentPace; // positive = getting faster
    if (improvementSec > 5) trend = "improving";
    else if (improvementSec < -5) trend = "declining";
    else trend = "plateau";
  }

  /* ---- heart-rate trend: last 3 runs of ANY type vs the 3 before that (context only, not a ---- */
  /* ---- gate — raw HR without controlling for pace/conditions is too weak to prescribe off; ---- */
  /* ---- kept on an any-type basis since it's a general cardiovascular-load signal, not a ---- */
  /* ---- race-pace-fitness one) ---- */
  const recentAny3Hr = runningActivities.slice(0, 3).map((a) => a.avg_hr).filter((v) => v != null);
  const avgRecentHr = recentAny3Hr.length ? avg(recentAny3Hr) : null;
  const priorAny3Hr = runningActivities.slice(3, 6).map((a) => a.avg_hr).filter((v) => v != null);
  const priorAvgHr = priorAny3Hr.length ? avg(priorAny3Hr) : null;
  let hrTrend = null;
  if (avgRecentHr != null && priorAvgHr != null) {
    const hrDiff = avgRecentHr - priorAvgHr;
    hrTrend = hrDiff > 5 ? "rising" : hrDiff < -5 ? "falling" : "stable";
  }

  /* ---- workload volume & injury risk ---- */
  const vol7 = volumeInWindow(runningActivities, 7);
  const vol14 = volumeInWindow(runningActivities, 14);
  const vol28 = volumeInWindow(runningActivities, 28);
  const chronicWeekly = vol28 / 4;
  const acwr = acuteChronicRatio(runningActivities);

  /* ---- consistency: rolling 4-week run counts ---- */
  const weekCounts = lastNWeekRunCounts(runningActivities, 4);
  const weeksWithRun = weekCounts.filter((c) => c >= 1).length;
  const toughLoveTrigger = weekCounts[0] <= 1 && weekCounts[1] <= 1;

  /* ---- REVL conditioning schedule: fixed Tue/Thu, no attendance tracking exists ---- */
  const todayDow = new Date().getDay();
  const isRevlDay = todayDow === 2 || todayDow === 4;

  /* ---- race periodization ---- */
  const nextRace = RACES.map((r) => ({ ...r, d: daysUntil(r.date) })).filter((r) => r.d >= 0).sort((a, b) => a.d - b.d)[0];
  const daysToRace = nextRace ? nextRace.d : null;
  let phase = "base";
  if (daysToRace != null) {
    if (daysToRace <= 6) phase = "taper";
    else if (daysToRace <= 28) phase = "peak";
    else if (daysToRace <= 56) phase = "build";
    else phase = "base";
  }
  const phaseLabel = { base: "Base building", build: "Build", peak: "Peak/Sharpen", taper: "Taper" }[phase];

  /* ---- workout format rotation, to avoid prescribing the exact same session every time ---- */
  const intervalFormats = [
    { kind: "interval", label: `6 × 1km @ {p}/km`, specifics: (p) => `Run 6 × 1km at ${p}/km pace, with 90 seconds easy jog recovery between reps. Warm up 1km easy first, cool down 1km easy after.`, dist: 8 },
    { kind: "interval", label: `4 × 1.5km @ {p}/km`, specifics: (p) => `Run 4 × 1.5km at ${p}/km pace, with 2 minutes easy jog recovery between reps. Warm up 1km easy first, cool down 1km easy after.`, dist: 9 },
    { kind: "interval", label: `Progression run`, specifics: (p) => `Run 6km continuous: first 2km easy, middle 2km at ${p}/km, final 2km faster than ${p}/km if it feels controlled.`, dist: 6 },
  ];
  /* ---- bodyweight-only compromised-running formats — no equipment, simulates Hyrox's ---- */
  /* ---- run-then-station fatigue pattern. Blended into the rotation only in build/peak ---- */
  /* ---- phase (see `pool` below) — base phase stays pure pace development. ---- */
  const compromisedFormats = [
    { kind: "compromised", label: `1km run + 15 burpees ×4`, specifics: (p) => `Run 1km at ${p}/km pace, then 15 burpees. Repeat for 4 rounds total — move straight from the run into the burpees, resting only as long as it takes to get moving again. This is about holding pace on tired legs, not the burpees themselves.`, dist: 4 },
    { kind: "compromised", label: `800m run + 20 squats + 15 pushups ×4`, specifics: (p) => `Run 800m at ${p}/km pace, then 20 bodyweight squats and 15 pushups. Repeat for 4 rounds total. Keep the transitions quick — the goal is holding pace off fatigued legs, which is exactly what race day demands.`, dist: 3.2 },
  ];
  const totalHardRunsLogged = runningActivities.filter(isHardRun).length;
  const pool = (phase === "build" || phase === "peak")
    ? [...intervalFormats, ...compromisedFormats, ...compromisedFormats]
    : intervalFormats;

  /* ---- lap-based fade detection: fetch the most recent hard-effort run's lap detail and ---- */
  /* ---- compare its first vs last ACTIVE-lap pace. A real fade means "give it another crack" ---- */
  /* ---- (repeat the same format); holding or negative-splitting means "progress". Background ---- */
  /* ---- enrichment only — degrades silently on 404/parse-failure/insufficient laps, no ---- */
  /* ---- user-facing loading/error state, unlike RunDetailModal's fetch. ---- */
  const lastHardRun = runningActivities.filter(isHardRun)[0] || null;
  const lastHardRunId = lastHardRun ? lastHardRun.id : null;
  const [fadeSignal, setFadeSignal] = useState(null);
  const [fadeDetail, setFadeDetail] = useState(null);

  useEffect(() => {
    let cancelled = false;
    setFadeSignal(null);
    setFadeDetail(null);
    if (!lastHardRunId) return;
    (async () => {
      try {
        const res = await fetch(`./activity_details/${lastHardRunId}.json`, { cache: "no-store" });
        if (!res.ok) return;
        const data = await res.json();
        if (cancelled) return;
        const activeLaps = (data.laps || []).filter((l) => l.intensity_type === "ACTIVE" && l.avg_pace_sec_per_km != null);
        if (activeLaps.length < 2) return;
        const firstPace = activeLaps[0].avg_pace_sec_per_km;
        const lastPace = activeLaps[activeLaps.length - 1].avg_pace_sec_per_km;
        const delta = lastPace - firstPace;
        const FADE_THRESHOLD_SEC = 8; // estimate, not empirically calibrated — tune later
        setFadeSignal(delta > FADE_THRESHOLD_SEC ? "faded" : delta < -FADE_THRESHOLD_SEC ? "negative_split" : "held");
        setFadeDetail({ firstPace, lastPace });
      } catch (e) {
        // silent no-op — background enrichment, not user-facing
      }
    })();
    return () => { cancelled = true; };
  }, [lastHardRunId]);

  // Known limitation: this correctly repeats the same format after a single fade, but doesn't
  // compound correctly across 2+ consecutive fades (no persisted state exists anywhere in this
  // app; building that is disproportionate to the value here). A repeated fade lands on an
  // adjacent-but-different format rather than the exact same one again — still reasonable.
  const naturalIndex = totalHardRunsLogged % pool.length;
  const priorIndex = (naturalIndex - 1 + pool.length) % pool.length;
  const format = pool[fadeSignal === "faded" ? priorIndex : naturalIndex];

  /* ---- activity-level HR cross-check (NOT daily wellness — Ivan only wears his Garmin ---- */
  /* ---- during exercise, so per-activity avg_hr/max_hr are reliable where daily resting_hr ---- */
  /* ---- is not). Informational context only, never a tier gate. ---- */
  const maxHrPool = runningActivities.map((a) => a.max_hr).filter((v) => v != null);
  const bestObservedMaxHr = maxHrPool.length ? Math.max(...maxHrPool) : null;
  const HR_EFFORT_RATIO_THRESHOLD = 0.88; // estimate, small sample size caveat — tune later
  const hrEffortRatio = (lastHardRun && lastHardRun.avg_hr != null && bestObservedMaxHr != null)
    ? lastHardRun.avg_hr / bestObservedMaxHr
    : null;
  const highEffortDespiteSlowPace = hrEffortRatio != null && hrEffortRatio >= HR_EFFORT_RATIO_THRESHOLD;

  const trendNote = trend === "improving"
    ? ` Your pace is trending faster than your prior block — the work is compounding.`
    : trend === "declining"
    ? ` Your pace has slipped versus your prior block — worth checking sleep, stress, and recovery between sessions, not just pushing harder.`
    : trend === "plateau"
    ? ` Your pace has been flat across your last 6 runs — a stimulus change, not just repetition, is what moves it now.`
    : "";

  let rec;
  let recIsHardEffort = false;
  let paceTier = null;

  if (runningActivities.length < 3) {
    rec = {
      objective: "Build a baseline",
      specifics: "Run 5km at a controlled, comfortable effort — don't chase pace yet.",
      distanceLine: "5 km, no pace target",
      targetPace: `Around ${secToPace(easyPaceSec)}/km or slower — a comfortable starting point, not something to chase yet`,
      why: `Only ${runningActivities.length} run(s) synced from Garmin so far — not enough history to prescribe a pace yet. This run establishes that baseline; from your next 3 runs onward, I'll prescribe an exact pace and distance.`,
    };
  } else if (isLayoff) {
    rec = {
      objective: "Reintroduction run",
      specifics: "Run at least 5km at an easy, conversational effort. Ignore pace completely today — distance and time on feet matter more than speed here.",
      distanceLine: "5+ km easy",
      targetPace: EASY_PACE_LABEL,
      why: `It's been ${lastRunGapDays} days since your last synced run. Picking up where your old pace data left off would risk injury — this session rebuilds the habit and checks how your legs respond before any quality work resumes. Treat 5km as a floor, not a cap — go further if it feels good, just keep the effort easy throughout.`,
    };
  } else if (acwr != null && acwr > 1.5) {
    rec = {
      objective: "Cut volume — injury-risk zone",
      specifics: "Run 4km easy, or take the day off if anything feels off.",
      distanceLine: "4 km easy, or rest",
      targetPace: EASY_PACE_LABEL,
      why: `Your acute:chronic workload ratio is ${acwr.toFixed(2)} — ${vol7.toFixed(1)}km in the last 7 days against a ${chronicWeekly.toFixed(1)}km/week average over the last month. Ratios above 1.5 are where the injury-risk research gets consistent — your body hasn't adapted to this volume yet. Backing off for a few days protects the fitness you've already built rather than risking a setback that costs weeks.`,
    };
  } else if (hardRunsWeek.length >= 2) {
    rec = {
      objective: "Easy or long run — protect the week",
      specifics: "Run 7km at a comfortable, conversational pace. No pace target today.",
      distanceLine: "7 km easy",
      targetPace: EASY_PACE_LABEL,
      why: `You've already run ${hardRunsWeek.length} hard sessions this week. A third would risk overtraining rather than building fitness — a coach caps quality sessions at 2 per week and fills the rest with easy aerobic volume.`,
    };
  } else if (phase === "taper") {
    recIsHardEffort = true;
    rec = {
      objective: `Taper touch — ${daysToRace} days to ${nextRace.name}`,
      specifics: `Run 3 × 1km at ${secToPace(GOAL_PACE_SEC)}/km with full recovery between reps, then stop. This is about staying sharp, not building fitness.`,
      distanceLine: `5 km total @ ${secToPace(GOAL_PACE_SEC)}/km on the reps`,
      targetPace: `${secToPace(GOAL_PACE_SEC)}/km — goal race pace`,
      why: `You're ${daysToRace} days out from ${nextRace.name}. This is taper territory — training load drops so you arrive fresh, but short race-pace touches keep your legs primed. Resist the urge to do more; fitness built this week won't show up on race day, but fatigue will.`,
    };
  } else if (toughLoveTrigger) {
    rec = {
      objective: "Rebuild the habit — consistency over pace",
      specifics: "Run 4-5km at an easy, no-pressure effort. The only goal today is showing up.",
      distanceLine: "4-5 km easy",
      targetPace: EASY_PACE_LABEL,
      why: `You've run ${weekCounts[0] + weekCounts[1]} time(s) in the last two weeks. That's not enough training stimulus for pace work to matter yet — chasing ${secToPace(GOAL_PACE_SEC)}/km off an inconsistent base builds neither fitness nor confidence. The fix isn't one heroic session; it's showing up again this week and next. Once you've strung together a couple of consistent weeks, pace work comes back on the table.`,
    };
  } else if (avgRecentPace == null || avgRecentPace > GOAL_PACE_SEC + 15 || !isConsistent) {
    recIsHardEffort = true;
    paceTier = "A";
    const paceStr = secToPace(GOAL_PACE_SEC);
    const volumeNote = phase === "base" ? " This is trimmed slightly since you're still in a base-building block — volume over intensity for now." : "";
    const consistencyNote = (avgRecentPace != null && !isConsistent)
      ? ` Your recent hard-effort paces have swung by more than ${PACE_CONSISTENCY_THRESHOLD_SEC}s/km run to run — that variance matters more than the average right now.`
      : "";
    const fadeNote = fadeSignal === "faded" && fadeDetail
      ? ` Your last hard session faded late (${secToPace(fadeDetail.firstPace)}/km first rep vs ${secToPace(fadeDetail.lastPace)}/km last rep) — same format again today to bank that stimulus before moving on.`
      : "";
    const hrNote = highEffortDespiteSlowPace
      ? ` Worth noting: your heart rate on that last hard run (${Math.round(lastHardRun.avg_hr)}bpm, ${Math.round(hrEffortRatio * 100)}% of your observed max of ${Math.round(bestObservedMaxHr)}bpm) shows it was a genuinely hard effort — the slower pace likely reflects conditions (heat, humidity) more than fitness.`
      : "";
    rec = {
      objective: format.kind === "compromised" ? `Compromised running work at ${paceStr}/km` : `Interval work at ${paceStr}/km`,
      specifics: format.specifics(paceStr),
      distanceLine: `${format.dist} km total @ ${paceStr}/km${format.kind === "compromised" ? " on the run segments" : " on the reps"}`,
      targetPace: `${paceStr}/km${format.kind === "compromised" ? " on the run segments" : " on the reps"} — goal race pace`,
      why: avgRecentPace != null
        ? `Your last ${recentHardRuns.length} hard-effort run(s) (${recentHardSummary}) averaged ${secToPace(avgRecentPace)}/km — ${Math.round(avgRecentPace - GOAL_PACE_SEC)}s slower than the ${paceStr}/km target you need across all 8 Hyrox rounds. Broken reps at target pace close that gap without the fatigue cost of a continuous effort at the same speed.${consistencyNote}${volumeNote}${trendNote}${fadeNote}${hrNote} Training phase: ${phaseLabel}${daysToRace != null ? ` (${daysToRace} days to ${nextRace.name})` : ""}.`
        : `No recent hard-effort runs in your synced history — nothing to average yet, so we build interval fitness rather than guess at a stretch target off zero evidence.${volumeNote}${fadeNote}${hrNote} Training phase: ${phaseLabel}${daysToRace != null ? ` (${daysToRace} days to ${nextRace.name})` : ""}.`,
    };
  } else if (avgRecentPace != null && avgRecentPace > GOAL_PACE_SEC && isConsistent) {
    recIsHardEffort = true;
    paceTier = "B";
    const hrNote = highEffortDespiteSlowPace
      ? ` Your heart rate on that last hard run (${Math.round(lastHardRun.avg_hr)}bpm, ${Math.round(hrEffortRatio * 100)}% of your observed max) confirms it was a genuinely hard, well-executed effort.`
      : "";
    rec = {
      objective: `Hold ${secToPace(GOAL_PACE_SEC)}/km continuously`,
      specifics: `Run 6km continuously at ${secToPace(GOAL_PACE_SEC)}/km pace — no walk breaks, no easing off after halfway.`,
      distanceLine: `6 km @ ${secToPace(GOAL_PACE_SEC)}/km`,
      targetPace: `${secToPace(GOAL_PACE_SEC)}/km — goal race pace, held continuously`,
      why: `Your last ${recentHardRuns.length} hard-effort run(s) (${recentHardSummary}) averaged ${secToPace(avgRecentPace)}/km, consistently within ${PACE_CONSISTENCY_THRESHOLD_SEC}s/km — close to target but not there continuously. You've done the broken-rep work; now prove you can hold ${secToPace(GOAL_PACE_SEC)}/km for a full sustained effort, which is what race day actually demands.${trendNote}${hrNote} Training phase: ${phaseLabel}${daysToRace != null ? ` (${daysToRace} days to ${nextRace.name})` : ""}.`,
    };
  } else {
    recIsHardEffort = true;
    paceTier = "C";
    const stretchPaceSec = Math.min(GOAL_PACE_SEC - 10, avgRecentPace - 10);
    const hrNote = highEffortDespiteSlowPace
      ? ` Your heart rate on that last hard run (${Math.round(lastHardRun.avg_hr)}bpm, ${Math.round(hrEffortRatio * 100)}% of your observed max) confirms it was a genuinely hard, well-executed effort.`
      : "";
    rec = {
      objective: `Push past target — ${secToPace(stretchPaceSec)}/km`,
      specifics: `Run 5 × 1km at ${secToPace(stretchPaceSec)}/km pace, with 90 seconds jog recovery between reps. Warm up 1km easy first, cool down 1km easy after.`,
      distanceLine: `7 km total @ ${secToPace(stretchPaceSec)}/km on the reps`,
      targetPace: `${secToPace(stretchPaceSec)}/km on the reps — faster than goal pace, since you're consistently beating it now`,
      why: `Your last ${recentHardRuns.length} hard-effort run(s) (${recentHardSummary}) averaged ${secToPace(avgRecentPace)}/km, consistently within ${PACE_CONSISTENCY_THRESHOLD_SEC}s/km — already at or under your ${secToPace(GOAL_PACE_SEC)}/km target. Sitting at that pace won't make you faster. The new target is ${secToPace(stretchPaceSec)}/km, set relative to your own demonstrated pace.${trendNote}${hrNote} Training phase: ${phaseLabel}${daysToRace != null ? ` (${daysToRace} days to ${nextRace.name})` : ""}.`,
    };
  }

  if (recIsHardEffort && isRevlDay) {
    const original = rec;
    rec = {
      objective: "Easy shakeout — REVL conditioning day",
      specifics: `Run 3-4km at an easy, conversational effort, or skip the run entirely if REVL conditioning is on today. Save the quality work (${original.objective}) for tomorrow or another non-REVL day.`,
      distanceLine: "3-4 km easy, or rest",
      targetPace: EASY_PACE_LABEL,
      why: `Tuesdays and Thursdays are reserved for REVL conditioning in your schedule — stacking a hard run on top of that class risks the same compounding fatigue as two hard sessions back to back. ${original.objective} is still the right next session — it's just better placed on a day without conditioning class competing for the same energy system.`,
    };
  }

  return (
    <>
      <div className="pp-card">
        <div className="pp-card-title"><TrendingUp size={15} /> Fitness Summary</div>
        <div className="pp-grid pp-grid-stats" style={{ gridTemplateColumns: "repeat(2, 1fr)", marginBottom: 14 }}>
          <StatBlock value={`${volWeekToDate.toFixed(1)} km`} label="this week" accent="teal" />
          <StatBlock value={`${chronicWeekly.toFixed(1)} km`} label="4-week avg" accent="teal" />
        </div>
        <div className="pp-run-summary">
          <div><span className="pp-kv-label">Recommended next run</span><span className="pp-kv-val">{rec.objective}</span></div>
          {rec.targetPace && (
            <div><span className="pp-kv-label">Ideal pace</span><span className="pp-kv-val">{rec.targetPace}</span></div>
          )}
          <div>
            <span className="pp-kv-label">Why</span>
            <div style={{ fontSize: 13, marginTop: 2, lineHeight: 1.5 }}>{rec.why}</div>
          </div>
        </div>
      </div>

      <div className="pp-card pp-context-card">
        <div className="pp-card-title"><Flag size={15} /> Training Context</div>
        <ul className="pp-coach-list">
          <li><span className="pp-tag priority">PHASE</span>{phaseLabel}{daysToRace != null ? ` — ${daysToRace} days to ${nextRace.name}` : " — no upcoming race scheduled"}</li>
          <li><span className={"pp-tag " + (hardRunsWeek.length >= 2 ? "alert" : "good")}>THIS WEEK</span>{hardRunsWeek.length} hard running session{hardRunsWeek.length === 1 ? "" : "s"} this week</li>
          {trend && (
            <li><span className={"pp-tag " + (trend === "improving" ? "good" : trend === "declining" ? "alert" : "warn")}>TREND</span>Pace is {trend} over your last 6 runs</li>
          )}
          {lastStrength && (
            <li><span className={"pp-tag " + (heavyStrengthRecent ? "warn" : "good")}>STRENGTH</span>Last session: {lastStrength.variation} {lastStrength.lift}, {strengthGapDays === 0 ? "today" : strengthGapDays === 1 ? "yesterday" : `${strengthGapDays} days ago`}</li>
          )}
          {acwr != null && (
            <li><span className={"pp-tag " + (acwr > 1.5 ? "alert" : acwr > 1.3 ? "warn" : "good")}>ACWR</span>{acwr.toFixed(2)} (7-day load vs 4-week average)</li>
          )}
          <li><span className={"pp-tag " + (weeksWithRun >= 3 ? "good" : weeksWithRun === 2 ? "warn" : "alert")}>CONSISTENCY</span>{weeksWithRun}/4 of your last calendar weeks (Mon-Sun) had a run</li>
          {hrTrend && (
            <li><span className={"pp-tag " + (hrTrend === "rising" ? "warn" : "good")}>HR TREND</span>Average run heart rate is {hrTrend} over your last 6 runs</li>
          )}
          {strengthCountWeek > 0 && (
            <li><span className="pp-tag good">REVL STRENGTH</span>{strengthCountWeek} strength session{strengthCountWeek === 1 ? "" : "s"} logged this week</li>
          )}
          {isRevlDay && (
            <li><span className="pp-tag priority">REVL DAY</span>Today's a scheduled REVL conditioning day — hard running is shifted to another day</li>
          )}
          {paceTier === "A" && highEffortDespiteSlowPace && (
            <li><span className="pp-tag warn">EFFORT CONTEXT</span>Last hard run's HR ({Math.round(lastHardRun.avg_hr)}bpm) was {Math.round(hrEffortRatio * 100)}% of your observed max despite a slower pace — likely conditions, not fitness</li>
          )}
        </ul>
      </div>

      <div className="pp-card pp-rec-card">
        <div className="pp-rec-objective">{rec.objective}</div>
        <div className="pp-rec-distance"><Timer size={16} /> {rec.distanceLine}</div>
        <div className="pp-rec-block">
          <div className="pp-rec-label">Do this</div>
          <div>{rec.specifics}</div>
        </div>
        {rec.targetPace && (
          <div className="pp-rec-block">
            <div className="pp-rec-label">Ideal pace</div>
            <div>{rec.targetPace}</div>
          </div>
        )}
        <div className="pp-rec-block">
          <div className="pp-rec-label">Why this, why now</div>
          <div>{rec.why}</div>
        </div>
        <div className="pp-rec-block">
          <div className="pp-rec-label">After this run</div>
          <div>{AFTER_RUN_NOTE}</div>
        </div>
        <div className="pp-rec-footnote">Last 7 days: {vol7.toFixed(1)}km synced (14-day: {vol14.toFixed(1)}km, 28-day: {vol28.toFixed(1)}km). REVL strength/cardio classes provide the rest of your conditioning load — this prescription cross-checks your logged lifting sessions where relevant.</div>
      </div>
    </>
  );
}

        icon={Dumbbell}
        text={`Strength Coach is coming in a future update. You've logged ${n} strength session${n === 1 ? "" : "s"} so far — that history will feed the recommendations once this ships.`}

  );
}

.pp-lap-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.pp-lap-table th { text-align: left; color: var(--dim); font-weight: 500; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.03em; padding: 6px 8px; border-bottom: 1px solid var(--border); }
.pp-lap-table td { padding: 7px 8px; border-bottom: 1px solid var(--border); font-family: 'JetBrains Mono', monospace; }
.pp-lap-table tr:last-child td { border-bottom: none; }
.pp-detail-note { font-size: 12.5px; color: var(--dim); padding: 10px 0; }
.pp-detail-section { margin-top: 18px; }
.pp-detail-section:first-child { margin-top: 0; }

.pp-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
.pp-modal { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; width: 100%; max-width: 480px; max-height: 88vh; display: flex; flex-direction: column; }
.pp-modal.pp-modal-wide { max-width: 740px; }
.pp-modal-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 18px; border-bottom: 1px solid var(--border); }
.pp-modal-header h2 { font-size: 15px; display: flex; align-items: center; gap: 8px; }
.pp-modal-body { padding: 16px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.pp-modal-footer { padding: 14px 18px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }
.pp-form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pp-form-row label, .pp-notes-label { display: flex; flex-direction: column; gap: 5px; font-size: 11.5px; color: var(--dim); }
.pp-form-row input, .pp-form-row select, .pp-notes-label input, .pp-notes-label textarea {
  background: #0D0E11; border: 1px solid var(--border); border-radius: 6px; padding: 8px 9px; color: var(--text); font-size: 13px; font-family: 'Inter', sans-serif;
}
.pp-form-row input:focus, .pp-form-row select:focus, .pp-notes-label input:focus, .pp-notes-label textarea:focus { outline: 2px solid var(--teal); outline-offset: 0; border-color: transparent; }
.pp-sets-label { font-size: 11.5px; color: var(--dim); }
.pp-set-row { display: flex; align-items: center; gap: 7px; }
.pp-set-row input { background: #0D0E11; border: 1px solid var(--border); border-radius: 6px; padding: 8px 9px; color: var(--text); font-size: 13px; flex: 1; width: 0; }
.pp-x { color: var(--dim); }

.pp-rec-card { max-width: 620px; }
.pp-rec-objective { font-family: 'Oswald', sans-serif; text-transform: uppercase; font-size: 18px; letter-spacing: 0.02em; color: var(--red); margin-bottom: 10px; }
.pp-rec-distance { display: flex; align-items: center; gap: 7px; font-family: 'JetBrains Mono', monospace; font-size: 14px; color: var(--teal); margin-bottom: 16px; }
.pp-rec-block { margin-bottom: 14px; font-size: 13px; line-height: 1.55; }
.pp-rec-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--dim); margin-bottom: 3px; font-weight: 600; }
.pp-rec-footnote { font-size: 11.5px; color: var(--dim); border-top: 1px solid var(--border); padding-top: 12px; margin-top: 6px; }

.pp-chart-note { font-size: 11px; color: var(--dim); margin-top: 8px; line-height: 1.5; }

/* ---- mobile: rail becomes a slim, sticky top bar ---- */
@media (max-width: 640px) {
  .pp-shell { flex-direction: column; }
  .pp-rail {
    width: 100%; flex-direction: column; gap: 0;
    padding: 0; border-right: none; border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10; background: var(--panel);
  }

  .pp-rail-top { display: flex; align-items: center; gap: 6px; padding: 8px 10px 0; }
  .pp-brand { flex-shrink: 0; padding: 0; }
  .pp-brand-text { display: none; }
  .pp-nav { flex-direction: row; gap: 2px; flex: 1; width: 100%; }
  .pp-nav-btn { flex: 1; flex-direction: column; gap: 2px; padding: 6px 2px; font-size: 8.5px; white-space: nowrap; }
  .pp-nav-btn span { font-size: 8.5px; }
  .pp-nav-btn.active { box-shadow: inset 0 -2px 0 var(--red); }

  .pp-rail-footer {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 6px 10px 8px; margin-top: 6px; border-top: 1px solid var(--border);
  }
  .pp-data-actions { flex-direction: row; border-top: none; padding-top: 0; gap: 4px; flex-shrink: 0; }
  .pp-data-actions .pp-btn { width: auto; padding: 6px 7px; }
  .pp-data-actions .pp-btn span { display: none; }

  .pp-countdown.compact { border-top: none; padding: 0; flex: 1; text-align: left; }
  .pp-countdown.compact .pp-countdown-label { display: none; }
  .pp-countdown.compact .pp-countdown-date { display: none; }
  .pp-countdown.compact .pp-countdown-digits { justify-content: flex-start; gap: 3px; margin-bottom: 0; }
  .pp-countdown.compact .pp-digit { font-size: 16px; padding: 2px 5px; }

  .pp-main { padding: 14px 14px 28px; }
  .pp-page-header { flex-direction: column; align-items: stretch; margin-bottom: 14px; }
  .pp-page-header h1 { font-size: 19px; }
  .pp-page-header p { font-size: 12px; }
  .pp-page-actions { width: 100%; }
  .pp-page-actions .pp-btn { flex: 1; justify-content: center; }
  .pp-section-label { margin: 2px 0 8px; }

  .pp-grid { gap: 10px; margin-bottom: 14px; }
  .pp-grid-stats { grid-template-columns: repeat(3, 1fr); }

  .pp-card { padding: 12px 14px; }
  .pp-hero-card { padding: 10px 14px; }
  .pp-countdown-digits { margin-bottom: 6px; }
  .pp-digit { font-size: 24px; padding: 2px 6px; }
  .pp-ring-wrap svg { width: 104px; height: 104px; }
}
`;


const rootEl = document.getElementById("root");
const root = ReactDOM.createRoot(rootEl);
root.render(<App />);
</script>
</body>
</html>
